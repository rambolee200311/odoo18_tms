# ==============================================================
# 【Sprint36-A Intent 契约 V3】
# 功能：建立 Settlement Domain External Input Boundary Layer
# 前置基线：Sprint35 字段遗漏修复
# 基线版本：context_version: 1.0.51 -> 1.0.52
# ==============================================================

intent_id: INT-TMS-SPRINT36-001
intent_work_type: Development
intent_change_type: New Feature + Domain Boundary Establishment
title: >
  Settlement External Intake Layer —
  Carrier Invoice Import（CSV/XLSX Adapter）

target_scope: >
  Sprint27-35 完成了 Settlement Domain 核心闭环：
  billing → matching → allocation → batch → case → correction → approval → export。

  本期最重要的不是你做了一个导入功能，而是：

  架构变化：
  Settlement Domain 新增 External Input Boundary Layer。

  外部数据禁止直接进入 billing，必须经过：

  ```
  External Carrier Data（CSV/XLSX）
            ↓
  Settlement Intake Layer
     ├── Parser（CSV/XLSX Adapter）
     ├── Validator（幂等 + 字段校验）
     ├── Preview（人工确认）
     └── Writer（生成 Billing Document）
            ↓
  Billing Domain
            ↓
  Matching Domain
            ↓
  Settlement
  ```

  本期实现 P0：
  - Invoice Template（可配置字段转换规则）
  - Import Batch + Import Line（Intake 生命周期）
  - Parser/Validator/Writer 三服务职责拆分
  - Partial Failure + Idempotency + Version Supersede

  不做边界：Rule Engine、Dashboard、PDF/OCR、自动记账、Audit、自动触发 Matching。

accept_criteria:
  # ========== P0: Invoice Template ==========
  - "tlmp.carrier.invoice.template：carrier_partner_id/name/file_type/mapping_json/is_active"
  - "mapping_json 升级为字段转换规则：{source_column, target_field, transform, format_params}"
  - "transform 预定义类型：char/decimal/integer/date/datetime/boolean"
  - "target_field 仅允许白名单字段，禁止 model_method/python_expression/arbitrary_eval"
  - "不同 carrier_partner 可绑定不同模板"

  # ========== P0: Import Batch ==========
  - "tlmp.carrier.invoice.import：name/carrier_partner_id/template_id/state/file_name/total_lines/success_lines/error_lines"
  - "state 状态机：draft → uploaded → preview → validated → waiting_confirm → importing → completed / partial_failed / failed / cancelled"
  - "preview 不产生任何业务数据（只解析不写入）"
  - "waiting_confirm 必须人工确认后才进入 importing"
  - "validated 不等于确认——财务场景必须有人工确认环节"

  # ========== P0: Import Line（临时 Intake 层）==========
  - "tlmp.carrier.invoice.import.line：import_id/line_no/raw_data(JSON)/parsed_data(JSON)/billing_line_id/import_status/validation_error_code/validation_message"
  - "import_status 状态机：pending → parsed → validated → imported → failed | skipped"
  - "Import Line 非业务事实，禁止直接查询 Line 做结算"
  - "人工确认发生在 Batch 层（waiting_confirm），Line 层不设 confirmed 状态"

  # ========== P0: Idempotency（业务幂等 + 技术去重双层）==========
  - "business_idempotency_key：carrier_partner_id + external_invoice_no + invoice_version"
  - "technical_duplicate_detection_hash：SHA256(carrier_partner_id + external_invoice_no + invoice_version + file_checksum)"
  - "billing.document 增加 external_invoice_no + invoice_version + external_document_ref + idempotency_hash + file_checksum + import_batch_id + import_line_id"
  - "billing.line 增加 external_line_key（import_line_id 引用）"
  - "版本策略 supersede：新版本导入后旧版本标记 superseded，不覆盖、不删除"
  - "billing.document 状态集：draft / active / superseded / cancelled"
  - "supersede 后处理规则：旧版本 immutable=true，新版本创建新 billing.document，已有 settlement 不自动重算"

  # ========== P0: Partial Failure ==========
  - "Import Batch 作为独立业务事务单元"
  - "Each Import Line 作为隔离处理单元"
  - "Failure：仅当前行回滚"
  - "Success：持久化 billing.line"
  - "Batch 最终状态：completed（全成功）/ partial_failed（部分成功）/ failed（全失败）"

  # ========== P0: Billing Document 创建必须经过 Import ==========
  - "billing.document 创建时必须携带 import_batch_id + import_line_id"
  - "直接通过 UI/API 创建 billing.document 无 import 上下文的请求被拒绝"
  - "实现方式：model level constraint 或 context flag（from_invoice_import=True）"

  # ========== P0: 编码支持 ==========
  - "CSV 自动识别编码 UTF-8/GBK/ISO-8859-1"
  - "无法识别时导入失败并提示编码问题"

source:
  type: product_roadmap
  origin_team: 产品/结算

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

domain_invariants:
  import_line_is_staging_only:
    rule: Import Line 是临时导入层，不是会计事实
    validation: 任何结算查询禁止直接引用 import.line，必须经过 billing.line
    criticality: P0

  invoice_business_identity:
    rule: 承运商发票的业务身份 = carrier + invoice_no + version
    validation: 同 business_idempotency_key 不可重复入账
    criticality: P0

  invoice_import_duplicate_detection:
    rule: 同一文件重复上传通过 SHA256 hash 检测
    validation: 同 technical_duplicate_detection_hash 拒绝重复处理
    criticality: P0

  billing_is_single_source_of_truth:
    rule: billing.document + billing.line 是唯一结算业务事实
    validation: Import Batch/Line 不可用于结算计算
    criticality: P0

  invoice_version_immutable:
    rule: 已导入的旧版本标记 superseded，不可覆盖/删除
    validation: 旧版本 billing.document state=superseded，数据不可变
    criticality: P0

  external_input_must_pass_validation:
    rule: 所有外部账单数据必须经过 Import Validation，禁止绕过 Import Layer 创建 Billing Document
    validation: billing.document 创建时必须携带 import_batch_id + import_line_id
    criticality: P0

  billing_import_no_auto_matching:
    rule: Import 完成后不自动触发 Matching，留待现有 Matching Scheduler 处理
    validation: Import Writer 不调用 matching engine
    criticality: P0

affected_assets:
  business:
