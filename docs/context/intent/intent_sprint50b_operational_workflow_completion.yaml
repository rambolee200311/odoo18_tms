validation_strategy:
  layers:
  - static_check
  - build_verify
  - auto_test
  - runtime_validate
  - business_review
  required_pass: all

deliverables:
- "TransportPlan 唯一状态归属 + 父子聚合（PickupPlanDetail / ContainerTransportDetail）"
- "Allocation Resource Reference（Vehicle / Driver 冻结字段）"
- "allocation_candidate JSON draft（transport.plan）"
- "snapshot_flow 三件套生命周期说明"
- "transport_event_code 版本化 + Ledger event_code_id 强绑定"
- "快递豁免三断言 + snapshot_invalid_test"
- "Sprint51 test_baseline 冻结清单"
- "freeze_policy（含版本号）与决策/版本/验证文档更新"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. 不新增业务场景、不新增 request 车辆需求字段、不新增状态、不新增规则维度
  3. 不建设 Carrier Settlement / OCR / Fleet Management；
     不新增 trailer / warehouse_slot / crane 资源域
  4. allocation_candidate 不建独立模型，不引入四层对象
  5. plan 物理迁移（方案 B）需业务 + 架构双审批，默认执行方案 A
  6. order.allocated 只验证快照，不重算规则；事件仅记录事实
  7. Event Ledger event_type 禁止直接写，必须经 event_code_id
  8. 49-B vehicle_requirement_snapshot 与已冻结规则保持不变

risk_precheck: |
  - TransportPlan 状态迁移需从 detail models 收敛，避免三状态并存
  - 外键切换涉及 schedule / order / request / 视图 / 安全 / 测试，
    先依赖梳理再分批切换，兼容周期内旧外键保留
  - order.allocated 快照验证需兼容存量 allocated 订单（补 snapshot）
  - Event Ledger 强绑定上线前，存量自由文本映射 LEGACY_* 并标记 legacy
  - snapshot_invalid_test 需真实构造失效快照，防止规则变更影响已确认业务
  - 快递豁免断言需防止空 JSON snapshot 被误判为有效分配
  - 业务链路测试依赖真实场景数据，测试库需先稳定（Sprint51 前）
