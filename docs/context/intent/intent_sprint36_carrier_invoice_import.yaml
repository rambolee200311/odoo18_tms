limit_constraints: |
  1. Invoice Import 一期仅支持 CSV 和 .xlsx（PDF 延后）。
  2. mapping_json 采用 JSON 字段转换规则格式（不做 UI 编辑器）。
  3. target_field 仅允许白名单字段，禁止 model_method/python_expression/arbitrary_eval。
  4. Import Line 是临时导入层，确认后业务数据进入 billing.line。
  5. Preview 不产生任何业务数据。
  6. Partial Failure：line-isolated processing，单行失败不影响其他行。
  7. 版本策略 supersede（不覆盖、不删除），旧版本标记 superseded，immutable=true。
  8. 幂等键双层设计：business_idempotency_key + technical_duplicate_detection_hash。
  9. billing.document 创建必须携带 import_batch_id + import_line_id。
  10. Import 完成后不自动触发 Matching。
  11. 本期不做 Match Rule Engine。
  12. 本期不做 Dashboard。
  13. 本期不做 Audit Log（已有 matching.history + 平台审计）。
  14. 本期不做 account.move 自动记账。
  15. 本期不做 Settlement Test Hardening（见 INT-TMS-SPRINT36-002）。

