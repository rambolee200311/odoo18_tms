# ==============================================================
# 【Sprint37 Intent 契约 V3】
# 功能：Settlement Exception Domain — 异常检测与人工闭环
# 前置基线：Sprint36 Settlement Intake Layer + Quality Gate
# 基线版本：context_version: 1.0.53 -> 1.0.54
# ==============================================================

intent_id: INT-TMS-SPRINT37-001
intent_work_type: Development
intent_change_type: New Feature + Domain Boundary Establishment
title: Settlement Exception Domain — 异常检测与人工闭环

target_scope: >
  Sprint27-36 完成了 Settlement Domain 核心功能闭环。

  Sprint37 建设 Settlement Exception Domain。

  P0: exception 模型（source_reference + snapshot 运营证据链）
  P0: 生命周期（new → assigned(requires_owner) → processing → resolved → closed / cancelled）
  P0: Auto Resolution（白名单 DUPLICATE_INVOICE → auto_closed，其余人工→case）
  P0: Settlement Review Queue（基于 exception 的待处理优先级视图）
  P1: exception_category（matching/billing/financial/operational/data_quality）
  P1: SLA 策略资产化 + compute sla_status

  不做边界：Dashboard、BI、Rule Engine、OCR、Carrier API、自动付款、自动记账、复杂审批流。

accept_criteria:
  # ======== P0: Settlement Exception Model ========
  - "tlmp.settlement.exception：name/exception_type/exception_category/state/priority/resolution_mode/source_reference/resolution"
  - "source_reference = {model(Char), res_id(Integer), display_name(Char), snapshot(JSON), captured_at(Datetime)}"
  - "snapshot 记录异常发生时的源数据快照（运营证据链）"
  - "exception_type 初版枚举（治理受控，新增需 governance_review）：
       MATCH_FAILED, AMOUNT_MISMATCH, DUPLICATE_INVOICE,
       INVALID_REFERENCE, IMPORT_ERROR, APPROVAL_TIMEOUT"
  - "exception_category：matching / billing / financial / operational / data_quality"

  # ======== P0: State Machine ========
  - "state：new → assigned → processing → resolved → closed"
  - "state：new → assigned → processing → cancelled（无需处理）"
  - "assigned 状态要求 assigned_to != null（invariant: assigned_requires_owner）"
  - "closed 和 cancelled 均为终态，不可逆"

  # ======== P0: Resolution Mode ========
  - "resolution_mode：manual（默认）| auto"
  - "auto_resolution 白名单：仅 DUPLICATE_INVOICE 允许 resolution_mode=auto"
  - "MATCH_FAILED / AMOUNT_MISMATCH / INVALID_REFERENCE / IMPORT_ERROR / APPROVAL_TIMEOUT → manual"
  - "auto 模式必须记录 resolution_note（system-generated）"

  # ======== P0: Manual → Case Routing ========
  - "exception.case_id = Many2one(tlmp.carrier.settlement.case)（可选）"
  - "case.exception_ids = One2many(exception)（反向）"
  - "manual exception 在 state IN [assigned, processing, resolved] 时要求 case_id 非空"
  - "state=new 时不要求 case_id（等待人工领取）"

  # ======== P0: Resolution Notes ========
  - "resolved：resolution_note required"
  - "auto_closed：resolution_note required（system-generated）"
  - "cancelled：cancel_reason required"

  # ======== P0: Review Queue（纯视图） ========
  - "基于 exception tree view，按 priority + created_at 排序"
  - "分组：urgent/high 在前，normal/low 在后"
  - "filter by exception_category / exception_type / state / assigned_to"
  - "sla_status 为 compute field（on_track / at_risk / overdue）"
  - "不建独立模型"

  # ======== P1: SLA ========
  - "SLA deadline 从 governance/sla_policy.yaml 加载，不硬编码"
  - "priority → SLA: urgent=4h, high=8h, normal=24h, low=72h"
  - "sla_deadline 为 stored field（created_at + policy lookup on create）"
  - "sla_status 为 compute field（不 stored，实时计算）"
  - "escalation_time（逾期时间，policy 中 escalation_threshold=1.5x）"

  # ======== Gate ========
  - "verify.py 8/8 PASS"
  - "odoo_check.py PASS（require_escalated）"

source:
  type: architecture_upgrade
  origin_team: 产品/结算

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

domain_invariants:
  exception_closed_immutable:
    rule: closed / cancelled 状态的 exception 不可修改
    validation: state=closed/cancelled 时 write/set_state 拒绝
    criticality: P0

  exception_assigned_requires_owner:
    rule: assigned 状态要求 assigned_to != null
    validation: state=assigned 时 assigned_to 不可空
    criticality: P0

  resolution_required:
    rule: resolved 必须有 resolution_note，cancelled 必须有 cancel_reason
    validation: state 迁移时验证对应字段非空
    criticality: P0

  case_created_for_manual_exception:
    rule: manual exception 在 assigned/processing/resolved 时必须关联 case
    validation: state in [assigned, processing, resolved] → case_id 非空
    criticality: P0

  auto_resolution_whitelist:
    rule: 仅 DUPLICATE_INVOICE 允许 resolution_mode=auto
    validation: 非 DUPLICATE_INVOICE 类型的 auto_close 被拒绝
    criticality: P0

  source_snapshot_is_traceable:
    rule: source_reference 必须包含 model + res_id + display_name + snapshot
    validation: create 时验证四字段完整
    criticality: P0

affected_assets:
  business:
    - settlement_domain
    - settlement_exception
  architecture:
    - settlement_module_map
  governance:
    - exception_invariant
    - exception_policy
    - sla_policy

