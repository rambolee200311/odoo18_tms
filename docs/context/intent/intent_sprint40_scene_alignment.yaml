# ==============================================================
# 【Sprint40 Intent 契约】
# 功能：Scene Domain Alignment — 场景主线贯穿
# 前置基线：Sprint39 Settlement Domain Production Readiness
# 基线版本：context_version: 1.0.56 -> 1.0.57
# ==============================================================

intent_id: INT-TMS-SPRINT40-001
intent_work_type: Development
intent_change_type: Architecture Upgrade
title: Scene Domain Alignment — Transport Scene 主线贯穿

target_scope: >
  Sprint27-39 完成了 Settlement Domain 全功能闭环 + 生产就绪验证。
  但核心运输链路（Transport Request → Plan/Quote → Order）缺少稳定的场景主线：

  当前问题：
  - transport_request 没有 scene_id——仅靠 request_type + destination_type 二维模型无法表达 8 场景
  - pickup_plan 没有 scene_id——order 创建时 scene 信息链断裂
  - transport_order.scene_id 总是 False——因为上游 request 就没有
  - scene → flow（plan_driven/commercial）无校验——运营人员可能选错路径
  - scene → transport_type 映射硬编码——新增场景需改代码

  Sprint40 不做新功能、不新增场景、不合并 Scene 8 独立模型。
  专注修复 **Scene 作为领域主线的贯穿能力**：

  P0: transport_request.scene_id（领域溯源）
  P0: pickup_plan.scene_id（related→request，非独立数据源）
  P0: transport_order.scene_id — immutable snapshot (created from request, then readonly)
  P0: Scene.flow_validation（allowed_flows + destination_types 校验）
  P0: E2E 测试（test_scene_flow.py——plan_driven + commercial 两条链）
  P1: Scene.default_transport_type（减少 transport_type 硬编码）
  P1: Quote→Order scene sync

  不做：Scene 7 swap container / Scene 8 合并 / Service Layer / Pricing Refactor。

accept_criteria:
  # ======== P0: transport_request.scene_id ========
  - "tlmp.transport.request 新增 scene_id（Many2one → tlmp.transport.scene）"
  - "request_type + destination_type 保留——但 scene_id 是新的领域溯源字段"
  - "request.form 视图增加 scene_id 字段"

  # ======== P0: pickup_plan.scene_id（related） ========
  - "pickup.plan 新增 scene_id（related='transport_request_id.scene_id', store=True）"
  - "pickup.plan 不可独立编辑 scene——仅从 request 继承"
  - "action_create_transport_order() 使用 pickup_plan.scene_id 而非空值"

  # ======== P0: transport_order.scene_id unified ========
  - "transport_order.scene_id 统一从上游同步（request → plan → order 或 request → quote → order）"
  - "quote._auto_create_order() 设置 order.scene_id = request.scene_id"
  - "pickup_plan.action_create_transport_order() 设置 order.scene_id = pickup_plan.scene_id"
  - "scene 信息在 Request→Plan/Quote→Order 全链不可断裂"

  # ======== P0: Scene Flow Validation ========
  - "tlmp.transport.scene 新增 allowed_flow_ids（Many2many → tlmp.transport.flow.type）"
  - "tlmp.transport.scene 新增 allowed_destination_ids（Many2many → tlmp.transport.destination.type）"
  - "transport.request 增加 @api.constrains('scene_id', 'request_type')——scene.flows 必须匹配 request_type"
  - "transport.request 增加 @api.constrains('scene_id', 'destination_type')——scene.destination_types 必须匹配 destination_type"
  - "新增 domain invariant：scene_request_type_consistent、scene_destination_type_consistent"

  # ======== P1: Scene.default_transport_type ========
  - "tlmp.transport.scene 新增 default_transport_type_id（Many2one → tlmp.transport.type）"
  - "pickup_plan._get_transport_type() 优先使用 scene.default_transport_type_id"
  - "container.service.request 创建 order 时同理"

  # ======== P1: Quote→Order Scene Sync ========
  - "quote._auto_create_order() 显式写入 order.scene_id"

  # ======== P0: E2E Tests ========
  - "test_scene_flow.py 覆盖 4 个场景：S1(Terminal→Warehouse plan) / S5(Warehouse Transfer plan) / S6(Customer Return commercial) / S8(Empty Move via container.service)"
  - "每个场景验证：Request→Plan/Quote→Order 的 scene_id 全链一致"
  - "Sprint39 的 4 个 Invariant 测试不受影响"

  # ======== Gate ========
  - "verify.py 8/8 PASS"
  - "odoo_check.py PASS（require_escalated）"
  - "全量 settlement tests PASS（Sprint39 regression 不回归）"

source:
  type: architecture_upgrade
  origin_team: 产品/研发

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

domain_invariants:
  scene_request_type_consistent:
    rule: transport.request 的 scene 必须允许 request_type（scene.allowed_flow_ids.code 包含该 request_type）
    validation: @api.constrains('scene_id', 'request_type')
    criticality: P0

  scene_order_immutable:
    rule: transport.order.scene_id 创建后不可修改（业务快照）
    validation: order write 拦截 scene_id 变更
    criticality: P0

  scene_destination_type_consistent:
    rule: transport.request 的 scene 必须允许 destination_type（scene.allowed_destination_ids.code 包含该 destination_type）
    validation: @api.constrains('scene_id', 'destination_type')
    criticality: P0

  scene_chain_unbroken:
    rule: scene_id 在 Request→Plan/Quote→Order 全链不可断裂
    validation: order.scene_id 必须来自上游 request.scene_id
    criticality: P0

affected_assets:
  business:
    - transport_request
    - pickup_plan
    - transport_order
    - transport_scene
    - transport_quote
    - transport_type
    - transport_flow_type
    - transport_destination_type
  architecture:
    - module_map
    - scene_domain_model
  governance:
    - scene_invariants

deliverables:
  # 模型变更
  - "models/transport_request.py（新增 scene_id + flow validation + destination validation constrains）"
  - "models/pickup_plan.py（新增 scene_id related + _get_transport_type 使用 scene.default_transport_type）"
  - "models/transport_order.py（unified scene_id sync——quote + plan 两条路径）"
  - "models/transport_scene.py（新增 allowed_flow_ids / allowed_destination_ids / default_transport_type_id）"
  - "models/transport_quote.py（_auto_create_order scene sync）"
  # 视图变更
  - "views/transport_request_views.xml（scene_id 字段 + scene 约束后 destination_type 联动）"
  - "views/transport_scene_views.xml（新的配置字段）"
  # 测试
  - "tests/test_scene_flow.py（4 scenarios × 全链 scene 一致性）"
  # 上下文
  - "docs/context/context_version.yaml（1.0.56 -> 1.0.57）"
  - "docs/context/history/decision_note.md（ADR-040）"

limit_constraints: |
  1. pickup_plan.scene_id 必须使用 related→request，禁止独立编辑。
  2. transport_order.scene_id 必须统一从上游同步（两条路径）。
  3. 不删除现有 request_type + destination_type——只增加 scene 层。
  4. 不做 Scene 7 swap container / Scene 8 合并。
  5. 不做 Service Layer / Pricing Refactor。
  6. E2E 测试 4 scenarios——不要求覆盖 Scene 7。

scope:
  allow:
    - "addons/wd_tlms/models/transport_request.py"
    - "addons/wd_tlms/models/pickup_plan.py"
    - "addons/wd_tlms/models/transport_order.py"
    - "addons/wd_tlms/models/transport_scene.py"
    - "addons/wd_tlms/models/transport_quote.py"
    - "addons/wd_tlms/models/__init__.py"
    - "addons/wd_tlms/views/transport_request_views.xml"
    - "addons/wd_tlms/views/transport_scene_views.xml"
    - "addons/wd_tlms/__manifest__.py"
    - "addons/wd_tlms/tests/test_scene_flow.py"
    - "addons/wd_tlms/tests/__init__.py"
    - "docs/context/context_version.yaml"
    - "docs/context/history/decision_note.md"

  forbid:
    - 禁止新增场景
    - 禁止删除 request_type 或 destination_type
    - 禁止修改 Scene 7/8 相关逻辑
    - 禁止合并 container.service.request
    - 禁止创建 Service Layer
    - 禁止修改 Settlement Domain 模型（billing/matching/allocation/batch/case）
    - 禁止修改 Exception Domain 模型（exception/rule）
    - 禁止修改 Sprint36-39 governance assets
    - 禁止修改 container.master 模型
    - 禁止修改 container.service.request 业务流程
    - 禁止修改 transport.event 状态机
    - 禁止修改 billing/pricing 逻辑
    - 禁止修改 execution/scripts/ governance/ intent 体系

goal: >
  修复 Transport Scene 作为领域主线的贯穿能力。

  Sprint40 完成后，核心链路变为：

  ```
  Transport Scene（模型增强——allowed_flows / allowed_destinations / default_transport_type）
        |
  Transport Request（新增 scene_id + flow validation + destination validation）
        |
    +----+----+
    |         |
  Pickup Plan（scene related→request）  Inquiry → Quote（scene sync）
    |         |
    +----+----+
        |
  Transport Order（scene unified from upstream）
        |
  Transport Event → Billing → Settlement
  ```

  scene 信息在 Request→Plan/Quote→Order 全链不可断裂。
  destination_type 的语义由 scene.allowed_destinations 约束。
  request_type 的语义由 scene.allowed_flows 约束。

# ADR-040 关键决策：
#   1. Sprint40 是 Scene Domain Alignment Sprint——不新增场景/功能
#   2. transport_request 新增 scene_id 作为领域溯源字段（不删除 request_type/destination_type）
#   3. pickup_plan.scene_id 使用 related→request（非独立数据源）
#   4. transport_order.scene_id 统一从上游同步（两条路径：plan + commercial）
#   5. Scene 新增 allowed_flows + allowed_destinations——flow validation 配置化
#   6. Scene 新增 default_transport_type——减少硬编码 mapping
#   7. Scene 7 换柜 / Scene 8 合并 / Service Layer / Pricing Refactor 暂缓
#   8. E2E 测试 4 scenarios（S1/S5/S6/S8）——确保全链 scene 一致
