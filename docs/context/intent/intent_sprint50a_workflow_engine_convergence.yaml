  layers:
  - static_check
  - build_verify
  - auto_test
  - runtime_validate
  - business_review
  required_pass: all

deliverables:
- "A1 迁移脚本：五模型 old→new 状态映射 + dry_run/execute 双模式 + 双快照/fulfillment/selected 字段回填"
- "tlmp.transport.plan 抽象模型 + transport_plan_id 关联（不物理合并业务子模型）"
- "tlmp.workflow.guard 配置模型 + guard_policy（默认 BLOCK）+ 4 条种子守卫"
- "五模型全部状态动作接入 Event Ledger；event_schema 字段规范落地"
- "vehicle_allocation_snapshot 在 transition_to_allocated() 生成与不可变校验"
- "plan.assignment_context 数据源 + RULE-VEHICLE-004 handler"
- "state_migration_plan.md / transport_event_dictionary.md 更新为可执行版本"
- "自动化测试与决策/版本/验证文档更新"

deferred_deliverables:
  A2:
  - "pickup.plan / container.transport.plan 外键切换与兼容层"
  - "是否物理收敛的最终数据决策与迁移"
  A3:
  - "完整车辆分配执行链（分配生命周期、司机主数据）"
  - "allocation 事件与结算/异常联动"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. 状态是计算结果，Event 是唯一事实；状态变更必须先写 Transport Event Ledger
  3. 旧状态值兼容别名仅保留一个版本周期；迁移脚本必须 dry_run + execute 双模式且幂等
  4. 49-B request 车辆需求字段与 vehicle_requirement_snapshot 不再新增/修改；
     分配字段只落在 plan/order 分配侧
  5. 守卫规则配置化，guard_policy 默认 BLOCK；缺配置默认拦截，禁止状态绕过
  6. 本 Sprint 不物理合并 pickup.plan / container.transport.plan；
     不建设 Driver Master，RULE-VEHICLE-004 只读 plan.assignment_context
  7. vehicle_allocation_snapshot 由业务动作 transition_to_allocated() 生成，
     事件不承担业务动作语义
  8. 异常字段化：exception 主状态 + exception_type 区分，不新增独立异常状态
  9. destination_type deprecated/readonly 兼容期继续保留，不删除

risk_precheck: |
  - 迁移顺序：dry_run 报告 → execute 幂等执行；先 schema，再 value 映射，
    最后快照/字段回填；全程同事务、可重跑
  - plan 抽象层只加 transport_plan_id 关联，不做表合并，避免大迁移 Sprint
  - Event Ledger 写入与 state 更新必须同一事务，禁止先改状态后补账本
  - RULE-VEHICLE-004 数据源冻结为 plan.assignment_context；
    缺失 driver_adr_valid / expiry_date 时不得静默 PASS
  - vehicle_allocation_snapshot 固化时机以 transition_to_allocated() 为准，
    confirm 后不可变
  - 存量 quote accepted→confirmed 迁移后，order 自动建单与 vehicle snapshot
    校验不得回归
