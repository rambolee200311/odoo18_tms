deliverables:
- "vehicle_requirement_mode 实时计算逻辑（readonly compute）+
  vehicle_requirement_mode_snapshot 冻结机制（submitted 后不可变）"
- "carrier_type_vehicle_policy 配置映射（复用 tlmp.business.rule 模型），
  仅控制车辆规则适用性，管理员可维护"
- "request 车辆需求结构，dangerous_goods_requirement 含结构化定义
  {is_dangerous_goods, adr_class, un_code}，需求结果通过 Rule Result 表达"
- "RULE-VEHICLE-000~003 & 005 配置化规则，语义层级：
  分流 > 危险品 > 载重 > 车型（ADR 司机资质归入 Sprint50）"
- "order vehicle_requirement_snapshot 与不可变校验"
- "plan 读取 Vehicle Requirement Result，在资源匹配阶段调用规则校验"
- "inquiry/quote 车辆维度展示策略：
  required→车辆约束摘要, exempted→'车辆要求：豁免'标记"
- "自动化测试（含 carrier_type 切换重算、policy 变更不影响历史 snapshot）
  与决策/版本文档更新"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. vehicle_requirement.md V1.0 为开发冻结基线；不再新增车辆维度字段，
     后续仅规则参数微调
  3. 不新增 Workflow 主状态；Rule Result 独立于 Workflow 状态，
     不新增车辆生命周期状态
  4. carrier_type → vehicle_requirement_mode 映射通过 carrier_type_vehicle_policy
     配置实现（复用 tlmp.business.rule 模型），不新建独立 model，不硬编码；
     carrier_type_vehicle_policy 仅控制车辆规则适用性，不决定车辆能力要求
  5. order vehicle_requirement_snapshot confirm 后不可变；
     vehicle_allocation_snapshot 归入 Sprint50
  6. 规则通过 Business Matrix Rule Engine 执行，不硬编码在流程层，
     不指定内部 API 名称
  7. 复用 carrier_type 表达运输提供方类型，不新增 transport_service_type
  8. vehicle_requirement_mode 为 readonly compute 字段，
     业务人员不可编辑，仅管理员可维护 carrier_type_vehicle_policy 配置；
     confirm 后使用 vehicle_requirement_mode_snapshot，不受 policy 变更影响
  9. ADR 司机资质（Driver ADR qualification）不在 Sprint49-B 范围，
     归入 Sprint50 Vehicle Allocation
  10. 不引入 require_adr_vehicle 字段，
      ADR 车辆需求由 dangerous_goods_requirement.is_dangerous_goods + 规则推导
  11. dangerous_goods_requirement 结构化定义：
      is_dangerous_goods: normal 时 adr_class/un_code 均为 NULL，
      adr_dangerous 时 adr_class/un_code 必填

risk_precheck: |
  - carrier_type_vehicle_policy 配置需兼容存量数据回填
  - 存量 request 需默认 vehicle_requirement_mode 回填
    （根据 carrier_type 查询 policy 配置计算），
    已 confirm 的 request 同时回填 vehicle_requirement_mode_snapshot
  - vehicle_requirement_mode_snapshot 与实时 vehicle_requirement_mode
    在 confirm 时刻必须一致，conflict 时报 BLOCK
  - carrier_type_vehicle_policy 修改不影响已 confirm 的 request/order snapshot
  - history/audit 需保留报价时可查看 vehicle_requirement_mode_snapshot 历史值
  - vehicle_requirement_mode 为 compute 字段，人为修改 carrier_type 后自动重算
    （confirm 前）; confirm 后使用 snapshot
  - plan 只读取 Requirement Result，不在此 Sprint 实现 Vehicle Allocation
  - 豁免场景需同时覆盖字段计算、校验跳过、inquiry/quote "豁免"标记展示与 order 快照