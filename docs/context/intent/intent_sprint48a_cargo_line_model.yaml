# ==============================================================
# Sprint48-A 子契约 — Cargo Line 包装层级模型升级
# 父契约：INT-TMS-SPRINT48-001（v2）
# ==============================================================
intent_id: INT-TMS-SPRINT48A-001
parent_intent_id: INT-TMS-SPRINT48-001
intent_work_type: Development
intent_change_type: Architecture Upgrade
title: Sprint48-A Cargo Line 包装层级模型升级

target_scope: >
  tlmp.transport.cargo.line 从“货物类型表”升级为“运输包装层级模型”：
  1. 新增 packaging_level（container / pallet / package / piece）
  2. 新增 parent_cargo_line_id，形成 container → pallet → package/piece 树
  3. 容器设备字段与货物字段分离：container_no / seal_no / container_type
  4. 字段重命名：pallet_gross_weight_kg / pallet_volume_m3（每托），
     piece_gross_weight_kg / piece_volume_m3（每件）
  5. 移除 batch_no，改 source_reference / source_module（WMS 推送通道）
  6. equivalent_pallets 计算字段与公式实现
  7. request 表头汇总逻辑切换为 Σ 顶层 cargo line

accept_criteria:
- "cargo_line 新增 packaging_level + parent_cargo_line_id，父子约束与层级校验通过"
- "container 设备字段独立且不参与托盘粒度汇总"
- "pallet/piece 字段命名与帮助文案按 v2 规格落地"
- "batch_no 字段移除，source_reference/source_module 可用"
- "equivalent_pallets = ceil(max(volume/pallet_volume_limit, weight/pallet_weight_limit)) 正确"
- "request 表头 = Σ 顶层 cargo line；子行不重复计入"
- "py_compile / lxml / XML-RPC 升级通过，日志零 ERROR"
- "单元测试覆盖层级树、汇总与公式"

source:
  type: architecture_upgrade
  origin_team: 研发 + 业务（Sprint48 v1 评审）
  based_on: INT-TMS-SPRINT48-001

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
  - all_validation_pass
  - human_accept
  - risk_block

affected_assets:
  architecture:
  - addons/wd_tlms/models/transport_cargo_line.py
  - addons/wd_tlms/models/transport_request.py
  - addons/wd_tlms/tests/test_transport_cargo.py
  governance:
  - docs/context/history/decision_note.md
  - docs/context/context_version.yaml

validation_strategy:
  layers:
  - static_check
  - build_verify
  - auto_test
  - runtime_validate
  - business_review
  required_pass: all

deliverables:
- "cargo_line 模型升级代码与视图字段"
- "层级树约束与汇总逻辑"
- "equivalent_pallets 公式与配置参数"
- "单元测试"
- "decision_note / context_version 更新"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. batch_no 不落 TLMS，未来由 WMS 通过 source_reference/source_module 推送
  3. pallet/piece 字段统一 pallet_*/piece_* 命名，禁止 unit_* 泛化
  4. 存量数据迁移由 Sprint48-C 处理，本阶段只改 schema 与逻辑

risk_precheck: |
  - 模型字段变更影响存量记录读取（C 阶段回填）
  - quote/order 快照引用 cargo line 的字段名需同步检查
