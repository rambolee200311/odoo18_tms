intent_id: INT-TMS-SPRINT50B-001
status: CREATED
depends_on:
- INT-TMS-SPRINT50-001
- INT-TMS-SPRINT50A-001
- INT-TMS-SPRINT49A-001
- INT-TMS-SPRINT49B-001
intent_work_type: Development
intent_change_type: Architecture Upgrade
title: TLMS Operational Workflow Completion

target_scope: >
  完成 Workflow Engine 从“状态转换能力”收敛为“事件驱动运输执行闭环”，
  冻结 Sprint49-B / Sprint50 / Sprint50-A 的车辆规则与事件模型，
  为 Sprint51 全量回归提供稳定测试基线。评审后范围：
  1. TransportPlan 唯一 Workflow 状态归属：
     - TransportPlan owns：scheduled / reserved / executing /
       finished / failed / cancelled；
     - Detail models（PickupPlanDetail / ContainerTransportDetail）
       do_not_own_workflow_state，只存业务操作属性；
     - 禁止出现 transport.plan.state / pickup_plan.state /
       container_plan.state 三状态并存
  2. Plan 聚合模型：
     - TransportPlan 为父对象（workflow lifecycle / reservation /
       allocation reference）；
     - PickupPlanDetail / ContainerTransportDetail 为业务明细子对象，
       仅含业务操作明细；默认方案 A（不物理删除），方案 B 需双审批
  3. Allocation Resource Reference（原 Vehicle / Driver）：
     - 仅定义执行校验所需字段：
       Vehicle Resource：vehicle_id / capacity / body_type / adr_valid；
       Driver Resource：driver_id / adr_valid / adr_expiry_date；
     - 不建设 Fleet Management；不新增 trailer / warehouse_slot /
       crane 等资源域，但命名保留扩展空间
  4. allocation_candidate 生命周期冻结：
     - type：JSON snapshot draft；
     - location：transport.plan；
     - purpose：plan.reserve 的临时校验结果；
     - NOT：独立业务对象 / 资源池对象；
     - 不新增 candidate / allocation / assignment / reservation
       四层对象
  5. snapshot_flow 生命周期：
     Request：vehicle_requirement_snapshot
         ↓
     Plan：allocation_candidate（JSON draft）
         ↓
     Order：vehicle_allocation_snapshot（固化）
     - plan.reserve = Validation（执行规则，生成 allocation_candidate）；
     - order.allocated = Verification（仅验证 snapshot exists + valid +
       assignment unchanged，不重算规则）
  6. Event Dictionary 版本化 + Ledger 强绑定：
     - transport_event_code：code / name / category / version /
       active / deprecated_at；编码不可删除只能废弃；
     - transport.event.ledger.event_code_id required；
       event_type 为 readonly related field，禁止直接写 event_type；
     - Ledger event_code_status：validated / legacy / deprecated，
       历史事件不篡改，存量自由文本映射 LEGACY_*
  7. 五模型业务链路最终测试：
     - 正常陆运全链路 PASS；
     - ADR 异常（ADR 货物 + 无 ADR 司机）→ BLOCK；
     - 快递豁免断言：vehicle_allocation_snapshot IS NULL、
       vehicle validation NOT executed、ADR rule NOT executed；
     - snapshot_invalid_test：已过期/失效的 vehicle_requirement_snapshot
       → order.allocate BLOCK（验证已确认业务不受规则变化影响）
  8. Sprint51 test_baseline 输出：
     - freeze：workflow states / event codes / vehicle snapshots /
       allocation reference fields；
     - used_by：Sprint51 regression

freeze_policy:
  after_sprint: Sprint50-B
  freeze:
  - workflow states
  - event codes
  - vehicle snapshots
  - allocation reference fields
  freeze_version:
    workflow_version: "1.0"
    event_dictionary_version: "1.0"
    vehicle_rule_version: "1.0"
  change_requires:
  - business_owner_approval
  - architect_approval

snapshot_flow:
  request:
    artifact: vehicle_requirement_snapshot
    lifecycle: submitted 后冻结
  plan:
    artifact: allocation_candidate
    lifecycle: plan.reserve 临时校验结果（JSON draft，非业务对象）
  order:
    artifact: vehicle_allocation_snapshot
    lifecycle: order.allocated 固化，不可变

allocation_candidate:
  type: JSON snapshot draft
  location: transport.plan
  purpose: temporary validation result
  independent_business_object: false

accept_criteria:
- "TransportPlan 唯一 Workflow 状态归属落地，detail models 不再维护 state"
- "Allocation Resource Reference 字段冻结，无 Fleet Management 扩展"
- "allocation_candidate 为 transport.plan 上的 JSON draft，未新增独立模型"
- "snapshot_flow 三件套生命周期清晰：requirement → candidate → allocation"
- "plan.reserve 执行规则并生成 allocation_candidate；order.allocated 仅验证快照"
- "Event Ledger event_code_id required + event_type readonly related，禁止直接写"
- "transport_event_code 版本化，编码不可删除只能废弃"
- "快递豁免三断言 + snapshot_invalid_test 自动化用例通过"
- "test_baseline 输出冻结清单供 Sprint51 regression 使用"
- "XML-RPC 常驻升级通过，日志零 ERROR；决策/版本/验证文档同步更新"

