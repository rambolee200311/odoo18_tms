# ==============================================================
# 【Sprint41 Intent 契约 V2】
# 功能：Transport Scenario Validation — 运输场景验证与运营就绪
# 前置基线：Sprint40 Scene Domain Alignment
# 基线版本：context_version: 1.0.57 -> 1.0.58
# ==============================================================

intent_id: INT-TMS-SPRINT41-001
intent_work_type: Maintenance
intent_change_type: Quality Hardening
title: Transport Scenario Validation — 运输场景验证与运营就绪

target_scope: >
  Sprint40 完成了 Scene Domain Alignment。Sprint41 不做任何模型修改，
  专注验证 8 个运输场景是否真正被统一模型表达。

  三层覆盖策略：
  - 8/8 场景 → Business Scenario Catalog（目录化覆盖）
  - 4/8 场景 → Business Acceptance Tests（自动化 BAT：S1/S5/S6/S8）
  - 8/8 场景 → Manual Verification Procedures（人工验证或轻量映射校验）

  80% 工作量在业务验证（non-code），20% 在自动化测试。
  核心目标：为 Sprint42 运营优化提供已验证的场景基线。

  P0: Business Scenario Catalog（8 场景 × 映射矩阵）
  P0: Golden Dataset（最小自洽数据集，无隐式依赖）
  P0: Business Acceptance Tests（4 场景 × 标准化断言模板）
  P1: Manual Verification Procedures + 结果记录

  不做：新 Scene / 模型修改 / request/order 重构 / settlement / exception / rule / pricing。

accept_criteria:
  # ======== P0: Business Scenario Catalog（8/8 场景）========
  - "docs/business/scenario_catalog.md 覆盖全部 8 个 Scene"
  - "每个 Scene 包含字段：scene_id / 业务名称 / 触发方式 / flow类型 / 入口单据 / 预期行为 / 对应模型链路 / 验证方式（BAT/Manual）"
  - "目录作为业务与技术的契约文档，Sprint42 后的功能变更必须同步更新本目录"

  # ======== P0: Golden Dataset（最小自洽，无隐式依赖）========
  - "固定业务数据，仅包含测试所需最小数据集，不依赖生产 seed"
  - "data/golden/base_data.xml（共享基础数据：客户/承运商/仓库/运输类型/柜档案）"
  - "data/golden/scenario_s1.xml（S1: Terminal→Warehouse，自洽，依赖 base_data）"
  - "data/golden/scenario_s5.xml（S5: Warehouse Transfer）"
  - "data/golden/scenario_s6.xml（S6: Customer Return）"
  - "data/golden/scenario_s8.xml（S8: Empty Container Move）"
  - "每个 scenario 文件是自洽的——依赖 base_data，不隐式依赖其他 scenario 文件"

  # ======== P0: Business Acceptance Tests（4/8 场景 × 标准化断言模板）========
  - "tests/test_business_scenarios.py 覆盖 S1/S5/S6/S8"
  - "每个 BAT 使用统一断言模板："
  - "  (1) 入口单据创建成功"
  - "  (2) scene 来源正确（request.scene_id = 预期场景）"
  - "  (3) 业务链路中 scene_id 不丢失（plan/quote → order 的 scene 一致）"
  - "  (4) order snapshot 在确认后不可变（readonly=True 约束）"
  - "  (5) 相关对象状态符合预期"
  - "  (6)（如适用）settlement 可访问 / allocation 存在"

  # ======== 8 场景覆盖表 ========
  # | scene | 名称                 | flow        | 入口             | 自动化 BAT | 手工验证 |
  # |-------|----------------------|-------------|------------------|------------|----------|
  # | S1    | Terminal → Warehouse | plan_driven | Pickup Plan      | ✅         | ✅       |
  # | S2    | Terminal → Customer | commercial   | Inquiry          | ❌         | ✅       |
  # | S3    | Warehouse → Customer| commercial   | Inquiry          | ❌         | ✅       |
  # | S4    | Customer → Customer | commercial   | Inquiry          | ❌         | ✅       |
  # | S5    | Warehouse Transfer   | plan_driven | Pickup Plan      | ✅         | ✅       |
  # | S6    | Customer Return      | commercial   | Inquiry → Quote  | ✅         | ✅       |
  # | S7    | Container Swap       | N/A          | Field Extension  | ❌         | ✅       |
  # | S8    | Empty Container Move | plan_driven  | Container Service| ✅         | ✅       |

  # ======== P1: Manual Verification + 结果记录 ========
  - "docs/business_validation/scene_*.md 覆盖全部 8 个场景"
  - "每个文档包含：前提条件 / 操作步骤 / 预期结果 / 检查点"
  - "docs/business_validation/result_summary.md 记录：场景通过/失败/失败原因/处理状态"

  # ======== P0: Gate ========
  - "verify.py 8/8 PASS（静态语法门禁 + XML 结构 + Odoo18 兼容 + View-Model 校验）"
  - "odoo_check.py PASS（require_escalated）"
  - "Sprint39 全量 regression tests 不回归"
  - "所有 BAT 自动化测试 PASS"
  - "data/golden/*.xml 通过 import_xml.rng 校验"

source:
  type: regular_audit
  origin_team: 产品/QA

asset_snapshot_profile: maintenance
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

affected_assets:
  business:
    - transport_scenario_validation
  architecture:
    - scene_domain_model
  governance:
    - golden_dataset
    - scenario_catalog

deliverables:
  # 场景目录（8/8 覆盖）
  - "docs/business/scenario_catalog.md（8 场景 × 映射矩阵）"
  # 黄金数据集
  - "data/golden/base_data.xml"
  - "data/golden/scenario_s1.xml"
  - "data/golden/scenario_s5.xml"
  - "data/golden/scenario_s6.xml"
  - "data/golden/scenario_s8.xml"
  # 业务验收测试（4/8 自动化）
  - "tests/test_business_scenarios.py（S1/S5/S6/S8 × 6 项统一断言模板）"
  # 人工验证流程（8/8 手工）
  - "docs/business_validation/scene_1_terminal_warehouse.md"
  - "docs/business_validation/scene_2_terminal_customer.md"
  - "docs/business_validation/scene_3_warehouse_customer.md"
  - "docs/business_validation/scene_4_customer_customer.md"
  - "docs/business_validation/scene_5_warehouse_transfer.md"
  - "docs/business_validation/scene_6_customer_return.md"
  - "docs/business_validation/scene_7_container_swap.md"
  - "docs/business_validation/scene_8_empty_container.md"
  # 验证结果闭环
  - "docs/business_validation/result_summary.md"
  # 上下文
  - "docs/context/context_version.yaml（1.0.57 -> 1.0.58：新增黄金数据集 + 场景目录 + BAT）"
  - "docs/context/history/decision_note.md（ADR-041）"

limit_constraints: |
  1. 禁止新增 Scene。
  2. 禁止修改 transport.request / pickup.plan / transport.order / transport.scene 模型。
  3. 禁止修改 settlement / exception / rule 模型。
  4. 禁止修改 pricing / billing / allocation 逻辑。
  5. 禁止新增模型。
  6. Golden Dataset 仅包含测试所需最小数据集，不依赖生产 seed。
  7. 每个 scenario 文件自洽——依赖 base_data，不隐式依赖其他 scenario 文件。
  8. BAT 使用 TransactionCase（自动回滚），不污染数据库。

scope:
  allow:
    - "docs/business/scenario_catalog.md"
    - "data/golden/*.xml"
    - "addons/wd_tlms/tests/test_business_scenarios.py"
    - "addons/wd_tlms/tests/__init__.py"
    - "docs/business_validation/*.md"
    - "docs/context/context_version.yaml"
    - "docs/context/history/decision_note.md"

  forbid:
    - 禁止新增 Scene
    - 禁止修改 transport.request / pickup.plan / transport.order / transport.scene
    - 禁止修改 settlement / exception / rule 模型
    - 禁止修改 pricing / billing / allocation 逻辑
    - 禁止修改 flow.type / destination.type
    - 禁止修改 golden dataset 之外的生产 seed data
    - 禁止创建新模型
    - 禁止修改 execution/scripts/ governance/ intent 体系

goal: >
  验证 Sprint40 的 Scene Domain Alignment 是否真正支撑欧洲物流实际运营流程。

  三层验证策略：
  - 8/8 场景 → Business Scenario Catalog（目录化覆盖 + 映射矩阵）
  - 4/8 场景 → Business Acceptance Tests（自动化 BAT + 标准化断言模板）
  - 8/8 场景 → Manual Verification Procedures（人工验证 + 结果闭环）

  四个核心自动化场景：

  ```
  S1: Terminal→Warehouse（plan_driven → pickup.plan → order → scene 贯穿）
  S5: Warehouse Transfer（plan_driven → warehouse_transfer → container handling）
  S6: Customer Return（commercial → inquiry → quote → order → scene 同步）
  S8: Empty Container Move（container.service.request → order → scene 来源）
  ```

  Sprint41 完成后产出：
  1. 8 场景 × 映射矩阵（目录化契约文档）
  2. 4 个黄金数据集（最小自洽、可导入、可回归）
  3. 4 个自动化 BAT（标准化断言模板）
  4. 8 份人工验证流程 + 验证结果闭环
  5. Settlement Domain 回归基线不受影响

# ADR-041 关键决策：
#   1. Sprint41 不修改任何业务模型——纯验证 sprint，80% non-code
#   2. 三层覆盖：8/8 目录 → 4/8 自动化 BAT → 8/8 手工验证
#   3. Golden Dataset 最小自洽——base_data + scenario 分层，无隐式依赖
#   4. BAT 使用统一 6 项断言模板——入口/场景/链路/snapshot/状态/settlement
#   5. Business Scenario Catalog 作为业务与技术的契约文档
#   6. result_summary.md 闭环验证结果——场景通过/失败/处理状态
#   7. Sprint40→Sprint41→Sprint42：架构对齐 → 业务验证 → 运营优化
