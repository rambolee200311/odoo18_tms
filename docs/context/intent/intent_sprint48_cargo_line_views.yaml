# ==============================================================
# Sprint48 Intent 契约 v2 — Cargo Line 运输包装层级模型收敛 + 三视图
# 评审修订：2026-08-05（架构评审后收敛，不推翻 Sprint48）
# ==============================================================
intent_id: INT-TMS-SPRINT48-001
intent_work_type: Development
intent_change_type: Architecture Upgrade
title: Cargo Line 包装层级模型收敛 + 柜/托/件三视图跨单证同步

target_scope: >
  Sprint48 v1 评审结论：Cargo Line 三视图方向正确，但 cargo_type 把
  “运输载体 / 包装单元 / 商品包装单元”三个不同维度混在同一张表。
  本 Sprint 做一次模型收敛：
  1. cargo_line 升级为“运输包装层级模型”：packaging_level
     （container / pallet / package / piece）+ parent_cargo_line_id 树形结构
  2. request.cargo_line_ids 定义为“客户申报运输需求（Transport Requirement）”，
     不是库存/货物真相
  3. inquiry / quote 使用 Cargo Summary（重量/体积/件数/包装汇总），不复制逐行托盘/件
  4. order 创建时快照复制 cargo line，并带 cargo_snapshot_version，历史不可变
  5. container 设备字段（container_no / seal_no / container_type）与货物字段分离
  6. batch_no 移出 TLMS，改 source_reference / source_module（未来由 WMS 推送）
  7. 字段命名明确：pallet_gross_weight_kg / pallet_volume_m3 /
     piece_gross_weight_kg / piece_volume_m3
  8. 等效托盘数公式：
     equivalent_pallets = ceil(max(volume / pallet_volume_limit,
     weight / pallet_weight_limit))

accept_criteria:
- "cargo_line 支持 packaging_level + parent_cargo_line_id 树（container → pallet → package/piece 可嵌套）"
- "request 表单按包装层级/视图显示：整柜视图（设备字段+柜级货重）、托盘视图（托盘数量/每托件数/单托重量体积/商品）、散件视图（单件长宽高/单件净重/包装类型）"
- "request 表头 = Σ 顶层 cargo line 汇总；pallet 行合计 = 数量×每托；piece 行合计 = 数量×每件；container 行合计 = 柜级录入或子行汇总"
- "inquiry / quote 显示 Cargo Summary（总重量/总体积/总件数/包装层级），不展开每托/每件"
- "order.cargo_line_ids 快照复制 + cargo_snapshot_version，订单创建后不可改"
- "equivalent_pallets 按 tlms.pallet_volume_m3 / tlms.pallet_max_weight_kg 上限参数计算并向上取整"
- "XML-RPC button_immediate_upgrade 验证通过，日志零 ERROR；自动化测试覆盖模型、汇总、单证同步与迁移"
- "decision_note.md、意图契约、场景文档、result_summary.md、context_version.yaml 同步更新"

