# ==============================================================
# 【Sprint35 意图契约】
# 功能：Match Rule Engine 2.0 + Settlement Dashboard
# 前置基线：Sprint34 结算域生产硬化
# 基线版本：context_version: 1.0.49 -> 1.0.50
# ==============================================================

intent_id: INT-TMS-SPRINT35-001
intent_work_type: Development
intent_change_type: New Feature
title: 匹配规则引擎升级 + 结算仪表盘 — Rule Engine 2.0 + Dashboard

target_scope: >
  Sprint33 完成了 Invoice Import 输入端标准化。
  Sprint34 完成了生产硬化测试（48 tests, verify 8/8 PASS, --test-enable 沙箱阻塞已知）。
  Sprint35 回归功能迭代：
  - P0: Match Rule Engine 2.0（condition line 拆表 + AND/OR + 优先级分组）
  - P1: Settlement Dashboard（财务/运营/风险三维 KPI）
  - 修复 Sprint34 测试中发现的缺陷（如有）
  - --test-enable 沙箱问题作为已知技术债，不阻塞本期开发。

accept_criteria:
  # P0: Match Rule Condition Line
  - "tlmp.carrier.match.rule.condition 拆表（替代 condition_json）"
  - "condition 字段：rule_id/field/operator/value/logic_operator/sequence"
  - "field 支持：ref_type/ref_value/carrier_id/amount_min/amount_max/date_from/date_to"
  - "operator 支持：eq/neq/contains/gt/lt/between"
  - "logic_operator 支持：AND/OR（条件分组）"
  - "向后兼容：现有 condition_json 照常工作，新规则使用 condition line"
  - "MatchService 按 rule.sequence + condition.line.sequence 执行"
  # P1: Settlement Dashboard
  - "财务卡片：本月承运商金额 / 已匹配 / 未匹配 / 争议金额"
  - "运营卡片：自动匹配率 / 人工审核率 / 平均解决时间"
  - "风险卡片：异常金额 Top10 / 超额收费 / 高争议承运商"
  - "Dashboard 使用 Odoo native dashboard（非 BI）"
  # Bug Fixes
  - "修复 Sprint34 production hardening 测试中发现的缺陷（如有）"
  # 门禁
  - "verify.py 8/8 PASS + odoo_check PASS"

source:
  type: customer_demand
  origin_team: 产品/结算

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

affected_assets:
  business:
    - match_rule_condition（新）
    - settlement_dashboard（新）
  architecture:
    - match_rule_upgrade（增量）
    - dashboard_views（新）
  history:
    - sprint34_test_results
    - previous_settlement_bugs

deliverables:
  match_rule_engine:
    - "models/transport_match_rule_condition.py（拆表）"
    - "services/transport_match_service.py（增量：condition line 执行）"
  dashboard:
    - "models/transport_settlement_dashboard.py（AbstractModel）"
    - "views/settlement_dashboard_views.xml"
  bug_fixes:
    - "sprint34_defect_fixes（如有）"
  tests:
    - "tests/test_match_rule_condition.py"
  context:
    - "docs/context/context_version.yaml（1.0.49 -> 1.0.50）"
    - "docs/context/history/decision_note.md（新增 ADR-035）"

limit_constraints: |
  1. condition line 与 condition_json 并存（不清洗存量数据）。
  2. Dashboard 使用 Odoo native dashboard/pivot（不做 BI 集成）。
  3. --test-enable 沙箱问题作为已知技术债，不阻塞本期。
  4. 本期不处理 Match Rule 模拟/预览（Sprint36）。
  5. 本期不做 settlement.case 自动分配（Sprint36）。

risk_precheck: |
  1. condition line 需要完全向后兼容，不破坏现有匹配流程。
  2. Dashbaord 指标需要与 Sprint27-33 数据模型对齐。
  3. Bug fixes 数量不确定 — 视 Sprint34 测试结果而定。

# Goal
goal: >
  升级 Match Rule Engine 2.0（condition line 拆表 + AND/OR + 优先级），
  建设 Settlement Dashboard（财务/运营/风险三维），
  修复 Sprint34 测试中发现的缺陷。

scope:
  allow:
    - "addons/wd_tlms/models/transport_match_rule_condition.py"
    - "addons/wd_tlms/models/transport_match_rule.py（增量）"
    - "addons/wd_tlms/services/transport_match_service.py（增量）"
    - "addons/wd_tlms/models/transport_settlement_dashboard.py"
    - "addons/wd_tlms/views/settlement_dashboard_views.xml"
    - "addons/wd_tlms/views/tlmp_menus.xml（增量）"
    - "addons/wd_tlms/security/ir.model.access.csv（增量）"
    - "addons/wd_tlms/models/__init__.py"
    - "addons/wd_tlms/__manifest__.py"
    - "addons/wd_tlms/tests/test_match_rule_condition.py"
    - "docs/context/context_version.yaml"
    - "docs/context/history/decision_note.md"

  forbid:
    - 禁止创建 settlement.audit.log（复用平台审计）
    - 禁止修改 billing/matching 现有匹配流程（仅增量）
    - 禁止修改 transport_event/exception/extra_charge 跟踪模型
    - 禁止修改 cmr/dgd/pod/shipment_label 文档模型
    - 禁止修改 execution/scripts/ governance/ 下任何文件
    - 禁止修改 profiles/context_loader/intent 体系

# ADR-035 关键决策：
#   1. Match Rule condition line 拆表，与 condition_json 并存
#   2. Dashboard 使用 Odoo native 能力，不做 BI
#   3. Sprint34 测试结果作为质量基线，新功能不降低通过率
#   4. --test-enable 沙箱问题作为已知技术债
#   5. 本期是 Sprint27-34 结算域之后的首个增强 Sprint
