# ==============================================================
# 【Sprint31 意图契约】
# 功能：结算争议工单 + 手动修正 + 成本对比
# 前置基线：Sprint30 自动匹配执行引擎
# 基线版本：context_version: 1.0.45 -> 1.0.46
# ==============================================================

intent_id: INT-TMS-SPRINT31-001
intent_work_type: Development
intent_change_type: New Feature
title: 结算争议工单 — Settlement Case + Manual Correction

target_scope: >
  基于《承运商结算需求说明书 V1.2》§6.8 P1 要求和 Sprint30 自动匹配结果，
  实现 settlement.case 争议工单闭环 + 手动修正审计 + 成本对比基础。
  不涉及 Credit/Debit 红字单据全流程（延后 Sprint32），
  不涉及月度对账导出和财务 AP 对接（延后 Sprint32）。

accept_criteria:
  # settlement.case 争议工单
  - "tlmp.carrier.settlement.case：case_no/case_type/state/billing_line_ids/owner_user_id"
  - "case_type 枚举：unmatched / amount_discrepancy / deduction / carrier_dispute / other"
  - "source 枚举：auto_matching/manual/import"
  - "state 状态机：open → processing → resolved → closed / open → cancelled / closed → reopened"
  - "自动创建规则：TransportAutoMatchService 执行完毕 + 该 billing.line 未产生 suggestion 或所有 suggestion 被 rejected + remaining_amount > 0 → 创建 case(source=auto_matching)"
  - "人工创建：支持手动创建 case 并关联 billing.line"
  - "CRUD 表单/列表/搜索（按 case_type/state/owner）"
  # 手动修正审计
  - "AllocationCorrectionService：reverse + replacement 模式（不直接修改 allocation）"
  - "所有修正操作强制：change_reason + matching.history（operation=manual_correction）"
  - "allocation 新增：is_reversal/reversed_allocation_id/correction_case_id/correction_reason/correction_user_id/correction_date"
  - "已 closed batch 的 allocation 不可修正（需先 re-open batch）"
  # 成本对比基础
  - "billing.line 增加 expected_amount（snapshot，创建 billing.line 时冻结，不随 transport_fee 后续变化）"
  - "transport_order estimated_carrier_cost（fee_line_ids carrier_cost 类型汇总）→ billing.line expected_amount"
  - "billing.line 增加 variance_amount + variance_percent（store=True，服务于财务查询性能）"
  - "billing.line 增加 dispute_state（normal/disputed/resolved）— case 不改变业务状态"
  # 集成
  - "settlement.case 与 billing.line / allocation / matching.history 关联"
  - "case 解决后自动更新关联 billing.line 状态"
  - "verify.py 8/8 PASS + odoo_check PASS"

source:
  type: customer_demand
  origin_team: 财务/结算

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

affected_assets:
  business:
    - settlement_case（新）
    - settlement_case_line（新）
    - allocation_service（增量：修正逻辑）
    - carrier_billing_line（增量：对比字段）
    - transport_order（增量：estimated_carrier_cost）
  architecture:
    - case_views（新视图）

# 模型设计参考
#
# tlmp.carrier.settlement.case
#   对账争议工单
#
#   name = Char(default='New')
#   case_type = Selection([
#     ('no_match', 'No Match'),
#     ('amount_diff', 'Amount Difference'),
#     ('overcharge', 'Overcharge'),
#     ('deduction_dispute', 'Deduction Dispute'),
#     ('other', 'Other'),
#   ], required=True)
#   state = Selection([
#     ('open', 'Open'),
#     ('processing', 'In Progress'),
#     ('resolved', 'Resolved'),
#     ('closed', 'Closed'),
#   ], default='open')
#   billing_line_ids = One2many(billing.line)
#   allocation_ids = One2many(allocation)
#   owner_user_id = Many2one(res.users, default=current)
#   resolution = Text
#   resolution_date = Datetime
#   attachment_ids = Many2many(ir.attachment)
#   company_id = Many2one(res.company)

validation_strategy:
  layers:
    - static_check
    - build_verify
    - auto_test
    - runtime_validate
    - business_review
  required_pass: all

deliverables:
  # 新模型
  - "models/transport_carrier_case.py（settlement.case + case.line）"
  # 服务增量
  - "services/allocation_correction_service.py（独立文件：AllocationCorrectionService reverse+replacement）"
  # 存量扩展
  - "models/transport_carrier_billing.py（增量：case_ids + estimated_amount/variance）"
  - "models/transport_order.py（增量：estimated_carrier_cost compute field）"
  - "models/transport_match_rule.py（增量：auto-fail → case auto-creation）"
  # 视图
  - "views/transport_carrier_case_views.xml"
  - "views/transport_carrier_billing_views.xml（增量：对比列）"
  # 权限
  - "security/ir.model.access.csv（新增权限）"
  # 测试
  - "tests/test_settlement_case.py（含 lifecycle + cancel + source + auto-create rules + closed_batch_protection）"
  - "tests/test_manual_correction.py（含 reverse-replacement + batch 保护 + 历史审计）"
  # 上下文
  - "docs/context/context_version.yaml（1.0.45 -> 1.0.46）"
  - "docs/context/history/decision_note.md（新增 ADR-031）"

limit_constraints: |
  1. settlement.case 一期不支持完整争议流转审批（延后 Sprint32）。
  2. 手动修正采用 reverse + replacement 模式。原 allocation 保留（is_reversal=True, reversed_allocation_id 指向新 allocation），不允许 update/delete。
  3. 已 closed batch 的 allocation 不可修正。
  4. 成本对比一期仅展示 estimated_amount / actual_amount / variance，不做 AI 差异分析。
  5. transport.order.estimated_carrier_cost 使用 fee_line_ids（carrier_cost 类型）汇总。
  5. settlement.case.line 作为中间层，一个 case 可关联多个 billing.line。
  6. 本期不创建 Credit/Debit 红字单据（延后 Sprint32）。
  7. 本期不做月度对账导出和财务 AP 对接（延后 Sprint32）。
  8. 本期不做 match.rule 复合条件升级（延后 Sprint32）。
  9. billing.line dispute_state 不影响业务状态（normal/disputed/resolved）。

risk_precheck: |
  1. auto-matching 失败自动创建 case：需在 match.execution _done 中处理 cancelled suggestion。
  2. 手动修正审计链：operation=manual_correction 不允许跳过历史记录。
  3. estimated_carrier_cost 依赖 fee_line_ids 准确性（Sprint5 费用底座）。

# Goal
goal: >
  建设结算争议工单闭环 + 手动修正审计 + 成本对比基础。
  覆盖 Sprint30 auto-matching 之后的异常处理和人工校正场景。

  本期交付：
  1. tlmp.carrier.settlement.case（争议工单 + 状态机）
  2. AllocationCorrectionService（手动修正审计）
  3. billing.line 成本对比（estimated vs actual）

scope:
  allow:
    - "addons/wd_tlms/models/transport_carrier_case.py"
    - "addons/wd_tlms/services/allocation_service.py（增量：修正逻辑）"
    - "addons/wd_tlms/models/transport_carrier_billing.py（增量）"
    - "addons/wd_tlms/models/transport_order.py（增量：estimated_carrier_cost）"
    - "addons/wd_tlms/models/transport_match_rule.py（增量：match.suggestion auto-create case）"
    - "addons/wd_tlms/models/__init__.py"
    - "addons/wd_tlms/views/transport_carrier_case_views.xml"
    - "addons/wd_tlms/views/transport_carrier_billing_views.xml（增量）"
    - "addons/wd_tlms/views/tlmp_menus.xml（增量：Documents 菜单）"
    - "addons/wd_tlms/security/ir.model.access.csv"
    - "addons/wd_tlms/__manifest__.py"
    - "addons/wd_tlms/tests/test_settlement_case.py"
    - "addons/wd_tlms/tests/test_manual_correction.py"
    - "docs/context/context_version.yaml"
    - "docs/context/architecture/module_map.md"
    - "docs/context/history/decision_note.md"

  forbid:
    - 禁止创建 Credit/Debit 红字单据完整流程
    - 禁止修改 batch approval 或 payment 状态
    - 禁止 match.rule 复合条件升级
    - 禁止 billing.upload/OCR
    - 禁止修改 transport_event/exception/extra_charge 跟踪模型
    - 禁止修改 cmr/dgd/pod/shipment_label 文档模型
    - 禁止修改 pricing_rule/fee/rate_base 计算逻辑
    - 禁止修改 execution/scripts/ governance/ 下任何文件
    - 禁止修改 profiles/context_loader/intent 体系

# 权限设计：
#   settlement_clerk:     case RWC (no unlink) / correction REQUEST
#   settlement_manager:   case RW + correction APPROVE
#   match_operator:       case R
#   settlement_config:    case RW
#   manager:              case RW + resolution
#   financier:            case R
#
# ADR-031 关键决策：
#   1. settlement.case 一期不完整争议流转（无审批、无附件强制），Sprint32 增强。
#   2. 手动修正必须通过 AllocationCorrectionService，强制产生 matching.history。
#   3. 成本对比一期仅展示，不自动生成调整建议。
#   4. auto-matching 失败（cancelled suggestion）自动创建 open case。
#   5. 已 closed batch 保护：不可修正，需先 re-open。
#   6. case resolved 不影响 billing.line 业务状态，仅更新 dispute_state。
#   7. allocation correction 采用 reverse + replacement 模式。
#   8. settlement.case.line 作为 case 与 billing.line 中间层。
#   9. billing.line actual_amount 为事实来源。
#   10. auto-matching 仅在无 suggestion 时创建 case。
