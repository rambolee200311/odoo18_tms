risk_precheck: |
  1. CSV 编码自动识别失败率需测试（UTF-8/GBK/ISO-8859-1）。
  2. Invoice Import 不负责匹配，仅负责外部账单落地。
  3. Import Line 数量可能很大（单次万级），考虑分批处理。
  4. superseded 版本的数据不可变策略需 migration 脚本支持。
  5. Odoo ORM 默认 transaction 不适用于 partial success——Import Batch 应使用独立业务事务，每行作为隔离处理单元。

# ======== Goal ========
goal: >
  建立 Settlement Domain External Input Boundary Layer（Settlement Intake Layer）。

  本期实现 CSV/XLSX Adapter：
  - Carrier Invoice Template（可配置字段转换规则，target_field 白名单）
  - Import Batch + Import Line（完整 Intake 生命周期）
  - Partial Failure（line-isolated processing）+ 双层 Idempotency（业务键 + 技术 hash）+ Version Supersede
  - Template 可配置化，新增承运商无需开发

  同时建立四条核心规范：
  1. 外部数据必须经过 Intake Layer，禁止绕过 Import 直接创建 Billing Document
  2. Import Line 是临时层，Billing Document 是唯一业务事实
  3. 幂等双层 + 版本不可变 + 人工确认审批
  4. Import 完成后不自动触发 Matching

# ======== 权限设计 ========
#   Invoice Operator（新增组，继承 group_tlm_operator）：
#     upload + preview Import（上传/预览不写入）
#   Settlement Clerk：
#     validate + confirm import（校验/确认写入）
#     Template: R（只读）
#   Settlement Config（新增组）：
#     Template: CRUD（维护模板配置）
#   Manager：
#     Template: approve template activation（审批启用）
#     confirm import
#   Finance：
#     R on all
#
# ADR-036-A 关键决策：
#   1. Settlement Intake Layer 作为 Settlement Domain 唯一外部数据入口
#   2. Import Batch + Import Line 是临时 Intake 层，Billing Document 是唯一业务事实
#   3. Import 支持 partial success，line-isolated processing（单行失败不影响其他行）
#   4. 双层 Idempotency：business_idempotency_key（业务幂等）+ technical_duplicate_detection_hash（文件去重）
#   5. Version 策略 supersede 不覆盖，旧版本标记 superseded（immutable=true）
#   6. Supersede 后处理：已有 settlement 不自动重算
#   7. billing.document 创建必须携带 import_batch_id + import_line_id
#   8. mapping_json 升级为字段转换规则（{source_column, target_field, transform}），target_field 白名单
#   9. Template 权限：Settlement Config CRUD，Manager 审批启用
#   10. Import 完成后不自动触发 Matching
#   11. 审计复用平台能力（matching.history + chatter）
#   12. 本期实现 CSV/XLSX Adapter，PDF/OCR/API 延后
#   13. Settlement Test Hardening 见 INT-TMS-SPRINT36-002
