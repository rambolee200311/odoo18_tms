intent_id: INT-TMS-SPRINT48A-001
status: COMPLETED
parent_intent_id: INT-TMS-SPRINT48-001
intent_work_type: Development
intent_change_type: Architecture Upgrade
title: Sprint48-A Cargo Hierarchy Model Upgrade（Cargo Node 包装层级模型）

target_scope: >
  tlmp.transport.cargo.line 升级为“Cargo Node”层级模型：
  1. 概念明确：Cargo Line 是运输货物层级节点，不代表一行货物
  2. 新增 node_type（equipment / cargo）
  3. packaging_level 固定枚举：container / handling_unit / package / piece
     （handling_unit = 托盘物理单元，避免与 Odoo stock.quant.package 冲突）
  4. parent_cargo_line_id 树 + 层级约束：
     container parent=None；handling_unit parent=container；
     package parent=handling_unit；piece parent=package 或 handling_unit；
     禁止跨级（如 piece → container）
  5. 容器设备字段独立：container_no / seal_no / container_type
  6. 字段重命名：pallet_gross_weight_kg / pallet_volume_m3（每托），
     piece_gross_weight_kg / piece_volume_m3（每件）
  7. 移除 batch_no；source 追溯字段：source_module / source_model /
     source_id / source_line_id
  8. equivalent_pallets 仅对 packaging_level in (package, piece) 计算
  9. request 表头汇总 = Σ 顶层 cargo node，子行不重复计入

accept_criteria:
- "cargo_line 模型含 node_type + packaging_level + parent_cargo_line_id"
- "层级约束校验通过：container→None、handling_unit→container、package→handling_unit、piece→package/handling_unit"
- "container 设备字段独立，不参与托盘粒度汇总"
- "pallet/piece 字段按 pallet_*/piece_* 命名，帮助文案明确每托/每件"
- "batch_no 已移除，source_module/source_model/source_id/source_line_id 可用"
- "equivalent_pallets 仅在 package/piece 层级计算，container 返回空"
- "request 表头 = Σ 顶层 cargo node"
- "py_compile / lxml / XML-RPC 升级通过，日志零 ERROR"
- "单元测试覆盖层级树、约束、汇总与公式"

source:
  type: architecture_upgrade
  origin_team: 研发 + 业务（Sprint48 第二轮评审）
  based_on: INT-TMS-SPRINT48-001

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
  - all_validation_pass
  - human_accept
  - risk_block

affected_assets:
  architecture:
  - addons/wd_tlms/models/transport_cargo_line.py
  - addons/wd_tlms/models/transport_request.py
  - addons/wd_tlms/tests/test_transport_cargo.py
  governance:
  - docs/context/history/decision_note.md
  - docs/context/context_version.yaml

validation_strategy:
  layers:
  - static_check
  - build_verify
  - auto_test
  - runtime_validate
  - business_review
  required_pass: all

deliverables:
- "cargo node 模型升级代码与层级约束"
- "source 追溯字段与 equivalent_pallets 公式"
- "单元测试"
- "decision_note / context_version 更新"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. packaging_level 固定枚举，禁止新增自由层级
  3. parent 层级约束强制校验，禁止跨级
  4. batch_no 不落 TLMS；handling_unit 命名避免 Odoo package 冲突
  5. equivalent_pallets 仅 package/piece 层级计算

risk_precheck: |
  - 模型字段变更影响存量记录（测试库按决定清空，无历史迁移）
  - quote/order 快照字段名需在 B 阶段同步检查
