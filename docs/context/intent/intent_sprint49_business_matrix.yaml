# ==============================================================
# Sprint49 Intent 契约 — 六维业务矩阵规则引擎
# 基线：docs/context/business/bussiness_matrix.md V1.0（Development Baseline）
# ==============================================================
intent_id: INT-TMS-SPRINT49-001
status: CREATED
intent_work_type: Development
intent_change_type: New Feature
title: 六维业务矩阵规则引擎 + 承运能力校验（Business Matrix Rule Engine）

target_scope: >
  基于 bussiness_matrix.md V1.0（Effective Sprint48）落地六维业务组合模型：
  A Scene（8）/ B Business Driver（2）/ C Cargo Type（3）/
  D Carrier Type（3）/ E T1 Attribute（2）/ F DG Attribute（2）。
  576 理论组合中约 280 组常态化有效，刚性互斥组合必须在前端过滤、后端拦截。
  1. request / cargo.line 增加六维字段与组合编码（A-B-C-D-E-F）
  2. cargo.line 增加 cargo_category（C1/C2/C3），与 packaging_level 层级模型收敛
  3. res.partner 增加承运能力 support_t1 / support_dg
  4. 新增业务矩阵规则服务（tlmp.business.matrix），统一校验并返回标准错误码+中文
  5. RULE-CARGO-001~005 / RULE-CARRIER-001~002 全入口生效
  6. RULE-SUMMARY-001：表头汇总仅统计当前激活 Cargo Type 明细
  7. Inquiry/Quote 保持摘要投影，不新增货物维度
  8. Order 快照补充 Business Rules Result 与 cargo_category，创建后固化

accept_criteria:
- "request 与 cargo.line 落地六维字段与组合编码（A-B-C-D-E-F）"
- "cargo_category C1/C2/C3 落地；单 Transport Request 单一 Cargo Type 后端强制（RULE-CARGO-005），切换 Tab 清空其他明细"
- "res.partner.support_t1 / support_dg 落地；E1/F1 场景承运商下拉过滤（RULE-CARRIER-001/002）"
- "规则服务覆盖 C1+D3、C3+E1、D3+E1、D3+F1、E1 无 T1 资质、F1 无 DG 资质、混合 Cargo Type 全部拦截"
- "规则在 create/write、XML-RPC、Excel 导入、自动建单全部生效，返回标准化错误码+中文说明"
- "RULE-SUMMARY-001 生效：表头 Pallets/Packages/Weight/Volume 仅统计当前激活 Cargo Type"
- "Order 快照含 cargo_category + Business Rules Result，confirm 后不可变"
- "Inquiry/Quote 仅摘要投影（description/qty/weight/volume/amount），无货物结构复制"
- "正向 6 例 + 负向 7 例测试全覆盖（前端/API/Excel 三入口）"
- "XML-RPC 常驻升级通过，日志零 ERROR；决策/版本/验证文档同步更新"

source:
  type: customer_demand
  origin_team: 业务 + 研发
  based_on:
  - "docs/context/business/bussiness_matrix.md V1.0（Development Baseline）"
  - "Sprint48-A/B/C（Cargo Node 三视图 + 单证投影 + 快照）"

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
  - all_validation_pass
  - human_accept
  - risk_block

affected_assets:
  architecture:
  - addons/wd_tlms/models/transport_request.py
  - addons/wd_tlms/models/transport_cargo_line.py
  - addons/wd_tlms/models/transport_order.py
  - addons/wd_tlms/models/transport_quote.py
  - addons/wd_tlms/models/transport_inquiry.py
  - addons/wd_tlms/models/res_partner.py
  - addons/wd_tlms/services/business_matrix.py
  - addons/wd_tlms/views/transport_request_views.xml
  - addons/wd_tlms/views/transport_carrier_profile_views.xml
  - addons/wd_tlms/views/transport_order_views.xml
  - addons/wd_tlms/tests/
  business:
  - docs/context/business/bussiness_matrix.md
  - docs/business_validation/result_summary.md
  governance:
  - docs/context/history/decision_note.md
  - docs/context/context_version.yaml

validation_strategy:
  layers:
  - static_check
  - build_verify
  - auto_test
  - runtime_validate
  - business_review
  required_pass: all

deliverables:
- "六维字段 + 组合编码（request / cargo.line / order 快照）"
- "cargo_category 与 packaging_level 收敛、单货型强制校验"
- "res.partner.support_t1 / support_dg 与承运商下拉过滤"
- "tlmp.business.matrix 规则服务（标准错误码+中文）"
- "三视图 Tab 清空与表头按激活货型汇总"
- "Order Business Rules Result 快照"
- "正向 6 例 + 负向 7 例自动化测试（三入口）"
- "decision_note / context_version / 验证文档更新"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. bussiness_matrix.md V1.0 为开发冻结基线；维度枚举与刚性互斥规则修改
     必须业务负责人 + 架构师双审批
  3. 不新建多张 cargo 明细表，统一 transport.cargo.line + cargo_category
  4. 单 Transport Request 单一 Cargo Type；Container 视图内托盘用
     pallets_in_container 计数，不允许混入 C2 子节点
  5. Inquiry/Quote 仅摘要投影，禁止新增货物维度字段
  6. Order 快照固化含 Business Rules Result，创建后不回写
  7. 前端 / API / Excel / 自动建单共用同一套矩阵校验

risk_precheck: |
  - packaging_level 层级树与 RULE-CARGO-005 单一货型冲突需收敛（容器子节点不允许跨类别）
  - 现有 carrier_type / fleet_operation_mode 需与 D1/D2/D3 对齐映射
  - 表头汇总语义从“全部行”改为“当前激活 Tab”的变化需回归验证
  - 测试库已清空，可按矩阵用例全量建数验证
