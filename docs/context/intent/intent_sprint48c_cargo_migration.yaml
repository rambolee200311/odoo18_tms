# ==============================================================
# Sprint48-C 子契约 v2 — Cargo Model Reset & Regression
# 父契约：INT-TMS-SPRINT48-001（v2）｜依赖：A + B
# 第二轮评审修正：2026-08-05｜测试库数据清空，不做历史迁移
# ==============================================================
intent_id: INT-TMS-SPRINT48C-001
parent_intent_id: INT-TMS-SPRINT48-001
depends_on:
- INT-TMS-SPRINT48A-001
- INT-TMS-SPRINT48B-001
intent_work_type: Maintenance
intent_change_type: Data Correction
title: Sprint48-C Cargo Model Reset & Regression（测试库清空 + 回归）

target_scope: >
  测试数据库历史数据全部清空（order / plan / inquiry / quote / request 及附属行），
  不执行 cargo_type → packaging_level 的历史迁移：
  1. 清空 tlmp.transport.order / pickup.plan / tlmp.transport.quote /
     tlmp.transport.inquiry / tlmp.transport.request 及 cargo line / fee line /
     container line / schedule 等附属记录
  2. 清空后按 Sprint48-A/B 新模型重建业务场景数据
  3. 回归验证一柜20托、托盘拆件双订单、报价快照冻结
  4. 若未来接入生产数据，package 映射必须人工确认，禁止自动归入

accept_criteria:
- "order / plan / inquiry / quote / request 相关模型 search_count = 0"
- "清空操作在新会话复核，附属记录同步为 0"
- "新模型下三个业务验收场景数据正确创建并验证"
- "XML-RPC 升级零 ERROR，自动化测试通过"
- "C 阶段执行记录与验证文档更新"

source:
  type: data_correction
  origin_team: 研发
  based_on:
  - INT-TMS-SPRINT48A-001
  - INT-TMS-SPRINT48B-001

asset_snapshot_profile: maintenance
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
  - all_validation_pass
  - human_accept
  - risk_block

affected_assets:
  architecture:
  - addons/wd_tlms/models/transport_cargo_line.py
  - addons/wd_tlms/models/transport_order.py
  - addons/wd_tlms/tests/
  business:
  - docs/business_validation/scene_3_warehouse_customer.md
  - docs/business_validation/result_summary.md
  governance:
  - docs/context/history/decision_note.md

validation_strategy:
  layers:
  - static_check
  - build_verify
  - auto_test
  - runtime_validate
  - business_review
  required_pass: all

deliverables:
- "测试库清空执行记录（模型与数量）"
- "新模型业务场景数据与回归结果"
- "验证文档与 result_summary 更新"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. 仅清空测试库，禁止在生产语义下执行
  3. 清空后必须新会话 search_count 复核
  4. 未来历史 package 映射人工确认，禁止自动归入 pallet/piece

risk_precheck: |
  - 清空操作不可逆，执行前确认测试库身份
  - 序列号不重置（本次不处理）
