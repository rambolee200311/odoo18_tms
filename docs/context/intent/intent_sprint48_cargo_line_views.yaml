- "cargo_line 模型：packaging_level / parent_cargo_line_id / 容器设备字段 / pallet_* / piece_* / source_reference / source_module（无 batch_no）"
- "request 三视图 UI + 汇总公式 + 等效托盘换算"
- "inquiry / quote Cargo Summary 投影"
- "order cargo snapshot + cargo_snapshot_version"
- "Sprint48-A/B/C 执行记录与迁移脚本"
- "自动化测试、业务验证文档、decision_note、context_version 更新"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. cargo_line 是运输包装层级树，不承载库存/批次真相；batch_no 不落 TLMS，
     由 source_reference/source_module 关联 WMS
  3. request.cargo_line 只记录客户申报运输需求；执行真相以 order cargo snapshot 为准
  4. inquiry/quote 用 Cargo Summary，不复制逐行托盘/件
  5. container 设备字段与货物行分离，支持换柜/空柜不污染货物
  6. pallet 字段命名 pallet_gross_weight_kg / pallet_volume_m3（每托）；
     piece 字段命名 piece_gross_weight_kg / piece_volume_m3（每件）
  7. equivalent_pallets = ceil(max(volume/pallet_volume_limit, weight/pallet_weight_limit))，
     参数 tlms.pallet_volume_m3 / tlms.pallet_max_weight_kg
  8. order snapshot 带版本且不可变

risk_precheck: |
  - cargo_type → packaging_level、unit_* → pallet_*/piece_* 数据迁移与回填
  - Scene 3 已建数据（request 2077 等）与 quote/order 快照兼容
  - Sprint47 验证文档与结果合并维护
