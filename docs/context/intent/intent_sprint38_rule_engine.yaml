    - 禁止修改 profiles/context_loader/intent 体系

risk_precheck: |
  1. condition_expression field catalog 必须严格——防止"加个小字段"绕过白名单。
  2. Rule Engine vs Legacy Handler 双写期间可能产生重复 exception——CREATE_EXCEPTION 防重复检查是底线。
  3. Execution 只记录 MATCHED + execution_id 全局唯一——保证幂等 + 避免爆炸。
  4. Rule Cache 一期 worker memory + manual refresh——二期可配置化。
  5. Legacy Handler Sprint40 删除——Sprint39 Dashboard 观察覆盖度。

goal: >
  将 Settlement Exception 检测从代码硬编码升级为可配置、可版本化、可审计的规则治理能力。

  架构：

  ```
  Rule Engine (priority)
       |
       +→ Rule Model (DB config)
       |    condition_expression + field_catalog 白名单
       |    scope (GLOBAL/CARRIER/CUSTOMER/SCENE)
       |    version + state (draft/active/deprecated)
       |
       +→ Evaluator → ActionExecutor
       |    action 白名单 + 幂等 + 防重复
       |
       +→ Legacy Handler (fallback, Sprint40 删除)
            Sprint37 handler 作为兜底
  ```

  本期交付：
  1. Rule Model + condition_expression + field_catalog + scope + version
  2. Rule Engine 四服务（Engine/Evaluator/ActionExecutor/RuleLoader）
  3. Action 白名单 + 幂等 + 防重复异常
  4. Execution 追溯（仅 MATCHED，execution_id 幂等）
  5. Legacy Handler fallback（Sprint40 删除）
  6. 8 个测试文件 + 4 个 governance 资产

# ADR-038 关键决策：
#   1. Rule Engine 渐进迁移——Handler 保留 fallback（Sprint40 删除，Sprint39 观察期）
#   2. Action 白名单——仅 exception domain 行为，禁止修改业务事实
#   3. condition_expression field 来自 field_catalog 白名单——禁止任意字段访问
#   4. Rule Execution 仅 MATCHED + execution_id 全局唯一——幂等 + 防膨胀
#   5. CREATE_EXCEPTION 前检查同 source + type 的 active exception——防重复
#   6. single active rule version——同一 code 同一时间仅一个 active version
#   7. Rule Cache 一期 worker memory + manual refresh
#   8. Sprint39: Dashboard + Rule Effectiveness / Sprint40: Intelligence + Legacy Removal
