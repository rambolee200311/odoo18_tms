  sprint48_b_docs: "request / inquiry / quote / order 单证同步 + 三视图 UI + Cargo Summary 投影"
  sprint48_c_migration: "历史数据迁移：cargo_type → packaging_level、unit_* → pallet_*/piece_*、parent 关系回填、回归验证"

