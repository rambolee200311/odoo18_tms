# ==============================================================
# 【Sprint38 Intent 契约 V3】
# 功能：Settlement Exception Rule Engine — 治理型异常规则引擎
# 前置基线：Sprint37 Exception Domain v1.0
# 基线版本：context_version: 1.0.54 -> 1.0.55
# ==============================================================

intent_id: INT-TMS-SPRINT38-001
intent_work_type: Development
intent_change_type: Architecture Upgrade + New Feature
title: Settlement Exception Rule Engine — 治理型异常规则引擎

target_scope: >
  Sprint37 建立了 Exception Domain，但检测逻辑仍硬编码。
  Sprint38 将异常检测从代码升级为可配置、可版本化、可审计的规则治理能力。

  架构：

  ```
  Sprint37:                          Sprint38:
  Exception Detector                 Exception Detector
       |                                  |
       v                                  v
  Handler Registry              Rule Engine (priority) → Legacy Handler (fallback)
  (硬代码)                          ↑                    ↑ (Sprint40 删除)
                              Rule DB (catalog)   Sprint37 handler (deprecated)
  ```

  P0: Rule 模型 + condition_expression Schema + field_catalog 白名单
  P0: Rule Engine 四服务（Loader/Evaluator/ActionExecutor/Engine）
  P0: Action 白名单 + 幂等 + 防重复异常
  P0: Execution 仅记录 MATCHED + 追溯
  P0: Version 控制（single_active_rule_version）
  P0: Scope 隔离（GLOBAL/CARRIER/CUSTOMER/SCENE）
  P1: Rule Cache Policy + Field Catalog 资产
  P1: Legacy Handler Sprint40 删除（Sprint39 观察期）

  不做：Dashboard、BI、AI、自动修改业务数据、自动付款、OCR。

accept_criteria:
  # ======== P0: Exception Rule Model ========
  - "tlmp.settlement.exception.rule：code/name/exception_type/condition_expression/rule_sequence/exception_priority/action_type/rule_state/version/effective_from/effective_to/created_by/approved_by/published_at"
  - "condition_expression 使用声明式 Catalog：AND/OR/NOT 嵌套 + operator: gt/lt/eq/contains/is_null"
  - "condition_expression 中的 field 必须来自 field_catalog 白名单（invariant: condition_field_whitelist）"
  - "rule_state：draft → active → deprecated（替代 boolean active）"
  - "UNIQUE(code, version)——同一规则不同版本唯一"
  - "single_active_rule_version：同一 code 同一时间仅允许一个 active version（invariant）"
  - "rule_sequence（整数）控制执行顺序，exception_priority 控制异常优先级"

  # ======== P0: Rule Execution Model ========
  - "tlmp.settlement.exception.rule.execution：rule_id/source_model/source_id/matched/created_exception_id/execution_time"
  - "仅 MATCHED 命中时生成 execution 记录（不做全量 NO_MATCH 日志）"
  - "Rule Engine 创建的 exception → rule_execution_id 必须填写"
  - "手动创建的 exception → rule_execution_id 可选"
  - "execution_id 全局唯一——保证 action 幂等（invariant: action_execution_idempotent）"
  - "execution 数据保留建议 90 天或 100k 条后归档"

  # ======== P0: Rule Engine ========
  - "services/exception_engine/engine.py（Orchestrator）"
  - "services/exception_engine/evaluator.py（condition_expression → true/false）"
  - "services/exception_engine/action_executor.py（白名单 action + 幂等检查）"
  - "services/exception_engine/rule_loader.py（DB → runtime cache）"
  - "Rule Engine 优先执行——匹配则创建 exception，不匹配则走 Legacy Handler fallback"
  - "CREATE_EXCEPTION 前检查同 source + exception_type 是否存在 active exception（防重复）"

  # ======== P0: Action Type ========
  - "action_type 白名单：CREATE_EXCEPTION / SET_PRIORITY / AUTO_CLOSE_EXCEPTION / CREATE_CASE"
  - "禁止：UPDATE_BUSINESS_DATA / MODIFY_ALLOCATION / MODIFY_BILLING / 自动审批"
  - "action_executor 执行前检查幂等——同 execution_id 不重复执行（invariant: action_execution_idempotent）"

  # ======== P0: Rule Scope ========
  - "scope_type：GLOBAL / CARRIER / CUSTOMER / SCENE"
  - "scope_reference: carrier_partner_id / customer_id / transport_scene_id（scope type 对应必填）"
  - "invariant: rule_scope_isolation — CARRIER scope 不影响其他 carrier，CUSTOMER 同理"

  # ======== P0: Condition Field Catalog ========
  - "governance/exception_rule_field_catalog.yaml（字段白名单）"
  - "允许字段：billing.amount, billing.currency, matching.confidence, carrier.code, invoice.age_days 等"
  - "禁止访问任意模型字段——field catalog 外字段拒绝（invariant: condition_field_whitelist）"

  # ======== P0: Exception 扩展 ========
  - "tlmp.settlement.exception 增加 rule_execution_id（可选 Many2one）"
  - "tlmp.settlement.exception 增加 scope_type（反向记录）"
  - "tlmp.settlement.exception 增加 creation_method：rule_engine / legacy_handler / manual"

  # ======== P0: Domain Invariants ========
  - "duplicate_exception_prevention：同一 source_reference + exception_type 不允许重复创建未关闭 exception"
  - "single_active_rule_version：同一 code 同一时间仅允许一个 active version"
  - "condition_field_whitelist：DSL field 必须来自 field catalog"
  - "action_execution_idempotent：同 execution_id 不重复执行"
  - "rule_version_immutable：active rule 不可修改"
  - "rule_scope_isolation：scope 不影响范围外实体"

  # ======== Gate ========
  - "verify.py 8/8 PASS"
  - "odoo_check.py PASS（require_escalated）"

source:
  type: architecture_upgrade
  origin_team: 产品/结算

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

