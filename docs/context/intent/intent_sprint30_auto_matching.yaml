limit_constraints: |
  1. auto-matching 仅匹配 billing.line 剩余金额 > 0。
  2. auto-matching 幂等控制：同一 billing_line + rule + execution_batch 不重复创建。
  3. auto-matching mode=only_create（禁止 update/delete allocation）。
  4. auto-confirm 阈值通过 ir.config_parameter 配置（tlms.match.auto_confirm_threshold, default=0.85）。
  5. carrier.profile 一对一绑定 res.partner（partner_id unique），不独立创建承运商身份。
  6. settlement.batch aggregated_total 为 stored compute，由 allocation 变化触发重算。
  7. 本期不做自动争议 Case（延后 Sprint31）。
  8. 本期不做费用差异对比（延后 Sprint31）。
  9. 本期不做 Credit/Debit 红字单据（Sprint31）。
  10. 本期不做 billing.upload/OCR（Sprint31-32）。
  11. 本期不做 AI/OCR（Sprint32 P2）。
  12. carrier.profile 不自动转换 supplier。
  13. auto matching 不允许匹配已 closed batch 的 billing.line。
  14. confirmed/closed batch 不允许新增 allocation。
  15. allocation 创建必须通过 AllocationService。
  16. manual correction 必须产生 matching.history。

risk_precheck: |
  1. auto-matching 幂等控制依赖 execution_batch_id，防止重复执行。
  2. carrier.profile pre_init 需处理大量存量 partner 的性能（分批创建）。
  3. settlement.batch aggregated_total stored compute 需确保 allocation 变更时正确触发。
  4. suggestion.state 扩展 auto_confirmed/allocated 不破坏 Sprint29 存量状态。

# Goal
goal: >
  建设自动匹配执行引擎，将 Sprint29 的匹配规则从手动建议升级为自动执行。
  同时落地 carrier.profile（扩展 res.partner）+ settlement.batch（含 batch.line）结算基础。

  本期交付：
  1. TransportAutoMatchService（auto-matching 引擎 + 幂等控制）
  2. tlmp.carrier.profile（一对一挂 res.partner，不独立主数据）
  3. tlmp.carrier.settlement.batch + batch.line（月度结算批次）
  4. suggestion.state 扩展 + auto-confirm 阈值可配置

