limit_constraints: |
  1. exception_type 为治理受控枚举——新增需 governance_review。
  2. auto_resolution 白名单仅 DUPLICATE_INVOICE。
  3. Review Queue 不建独立模型，纯视图 + action + filter + compute field。
  4. SLA deadline 从 governance/sla_policy.yaml 加载；sla_status 为 compute field（不 stored）。
  5. exception.case_id 为 Optional Many2one，case.exception_ids 为 One2many inverse。
  6. 本期不做复杂审批流 / Dashboard / BI / Rule Engine / OCR / API / 自动付款 / 自动记账。

