# ==============================================================
# 【Sprint36-B Intent 契约】
# 功能：结算域生产硬化 — Settlement Domain Test Hardening
# 前置基线：Sprint36-A Carrier Invoice Import
# 基线版本：context_version: 1.0.52 -> 1.0.53
# ==============================================================

intent_id: INT-TMS-SPRINT36-002
intent_work_type: Maintenance
intent_change_type: Quality Hardening
title: Settlement Domain Test Hardening — 全链路质量基线

target_scope: >
  Sprint27-36-A 完成了 Settlement Domain 功能闭环：
  billing → matching → allocation → batch → case → correction → approval → export → import。
  本期是第一次对结算域做全链路质量硬化：

  - P0: 金额守恒 + 状态机合规 + 幂等安全 + 权限隔离 四大测试矩阵
  - P0: Domain Invariant 自动化验证
  - P1: 回归基线建立

  不做新功能、不做 UI、不做架构调整。

accept_criteria:
  # P0: 金额守恒
  - "billing.total = allocation.total + unallocated.amount"
  - "batch.total = sum(allocation)"
  - "original + reversal + replacement = final amount（修正一致）"
  # P0: 状态机合规
  - "Batch lifecycle: draft → processing → confirmed → closed"
  - "closed 后禁止修改 allocation"
  - "Case lifecycle: open → in_progress → resolved → closed"
  # P0: 幂等安全
  - "重复执行 run_matching() → allocation 数量不变"
  - "同 idempotency_hash 不产生重复 billing"
  # P0: 权限隔离
  - "operator 不能修改 allocation"
  - "clerk 可以修正 allocation"
  - "manager 审批 batch"
  - "financier 导出"
  # P0: Matching 置信度边界
  - "confidence >= 0.85 → auto_confirmed + allocation 创建"
  - "confidence < 0.70 → draft 不创建 allocation"
  # P1: 回归基线
  - "全量测试单次运行通过率 >= 95%"
  - "新增模块测试文件不影响已有测试"

source:
  type: quality_improvement
  origin_team: 工程/QA

asset_snapshot_profile: maintenance
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

domain_invariants:
  allocation_never_exceed_billing:
    rule: allocation_total <= billing_line_total
    validation: 创建/修正 allocation 时自动校验
    criticality: P0
  closed_batch_immutable:
    rule: batch state=closed 时禁止修改 allocation
    validation: 状态机约束 + 测试验证
    criticality: P0
  correction_preserves_history:
    rule: 修正必须保留原 allocation（is_reversal=True）
    validation: matching.history + allocation 历史链
    criticality: P0
  duplicate_execution_safe:
    rule: 同一 execution_id 重复执行结果不变
    validation: 幂等测试
    criticality: P0

affected_assets:
  business:
    - settlement_domain
  architecture:
    - settlement_module_map
  governance:
    - invariant_validation
    - regression_baseline

deliverables:
  # 回归测试（单文件，不按模型复制）
  - "tests/test_settlement_regression.py（集成所有 invariant + 状态机 + 权限 验证）"
  # 上下文
  - "docs/context/context_version.yaml（1.0.52 -> 1.0.53）"
  - "docs/context/history/decision_note.md（新增 ADR-036-B）"

limit_constraints: |
  1. 本期不做任何新功能开发。
  2. 本期不做 UI 调整。
  3. 本期不做架构调整。
  4. 测试必须基于真实模型实例，不 mock 核心业务服务。
  5. 回归测试一个文件（test_settlement_regression.py），不按模型分拆。
  6. 权限测试使用 Odoo 标准 test_security 方式（sudo/user context）。

risk_precheck: |
  1. 全链路测试依赖真实数据库，沙箱可能阻断 PostgreSQL 连接。
  2. 当前 Sprint21 遗留 12 个失败用例需先确认是否影响本域测试。
  3. test_settlement_regression.py 包含多个 TestCase class，建议按 domain_invariant 分组。

# ======== Goal ========
goal: >
  为 Settlement Domain 建立全链路质量基线。
  通过四大测试矩阵（金额守恒、状态机合规、幂等安全、权限隔离）
  确保结算域在真实数据压力下不会错账、不会重复、不会越权。

# ADR-036-B 关键决策：
#   1. 回归测试集中一个文件，不按模型分拆（避免每个 sprint 复制测试文件）
#   2. Domain Invariant 自动化验证作为测试核心驱动力
#   3. 测试基于真实模型实例，不 mock
#   4. 本期不修改任何业务模型代码
#   5. Sprint21 遗留 12 个失败用例需隔离确认不影响结算域
