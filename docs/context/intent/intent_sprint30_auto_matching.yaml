# ==============================================================
# 【Sprint30 意图契约】
# 功能：自动匹配执行 + carrier.profile + settlement.batch
# 前置基线：Sprint29 match.suggestion 匹配建议基石
# 基线版本：context_version: 1.0.44 -> 1.0.45
# ==============================================================

intent_id: INT-TMS-SPRINT30-001
intent_work_type: Development
intent_change_type: New Feature
title: 自动匹配执行 + Carrier Profile + Settlement Batch

target_scope: >
  基于《承运商结算需求说明书 V1.2》Sprint30-B P0 要求和架构评审结论，
  实现自动匹配执行引擎 + carrier.profile（挂 res.partner）+ settlement.batch（含 batch.line）。
  核心链路：match.rule → match.suggestion → auto_confirm → allocation → batch。
  不创建独立的 carrier.company 主数据（改用 carrier.profile 扩展 res.partner）。
  不做自动争议 Case（延后 Sprint31），不做费用差异对比（延后 Sprint31）。

accept_criteria:
  # auto-matching 引擎
  - "TransportAutoMatchService：collect_all_candidates 策略（收集所有候选，取最高 confidence 自动确认）"
  - "suggestion.state 扩展为：draft / auto_confirmed / manual_confirmed / rejected / allocated / cancelled"
  - "auto-matching 仅匹配 billing.line 剩余金额 > 0 且未被该 rule 匹配过的行"
  - "auto-confirm 阈值通过 ir.config_parameter tlms.match.auto_confirm_threshold（默认 0.85）配置"
  - "幂等控制：同一 billing_line + rule + execution_batch 的匹配不重复创建 allocation"
  - "AllocationService auto 模式仅允许 create，禁止 update/delete 已存在的 allocation"
  - "matching.history 增量：execution_id / error_message / allocation_id / from_state / to_state"
  # carrier.profile
  - "tlmp.carrier.profile：partner_id(unique)/carrier_code/carrier_type/is_active/settlement_mode"
  - "carrier_type 枚举：truck/express/_3pl"
  - "partner_id = Many2one(res.partner, unique) —— carrier.profile 不独立创建承运商身份"
  - "carrier.profile 创建策略：manual 或 on_first_carrier_usage（不自动转换 supplier）"
  # settlement.batch + batch.line
  - "tlmp.carrier.settlement.batch：name/carrier_partner_id/period_start/period_end/state"
  - "state 状态机：draft → processing → confirmed → closed (+ cancelled)"
  - "aggregated_total stored compute（allocation create/write/unlink 触发重新计算）"
  - "tlmp.carrier.settlement.batch.line：batch_id/billing_document_id/billing_line_id/allocation_ids/amount"
  - "CRUD 视图 + 搜索（按 carrier/period/state）"
  # 集成
  - "auto-matching 可手动触发（action_run_matching 按钮）"
  - "settlement.batch 可从 billing.document 创建"
  - "verify.py 8/8 PASS + odoo_check PASS"

source:
  type: customer_demand
  origin_team: 财务/结算

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

affected_assets:
  business:
    - carrier_profile（新——扩展 res.partner）
    - carrier_settlement_batch（新）
    - carrier_settlement_batch_line（新）
    - transport_match_service（增量：auto-matching）
    - carrier_allocation_service（增量：auto-allocation）
    - carrier_match_suggestion（增量：auto_confirmed/allocated 状态）
  architecture:
    - settlement_batch_views（新视图）
    - module_map（更新结算域）

