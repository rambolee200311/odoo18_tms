deliverables:
- "五模型状态机收敛代码与状态迁移"
- "Transport Event Ledger 模型 + 服务（先写账本再更新状态）"
- "守卫规则配置与校验（guard_rules）"
- "request 聚合字段 + fulfillment_status 部分履约"
- "inquiry/quote/plan 状态与进度/议价字段"
- "order exception_type 字段化"
- "destination_type 冗余字段下线（兼容计算）"
- "Rule Engine 集成（BLOCK/WARNING + snapshot 生命周期钩子）"
- "自动化测试与决策/版本/验证文档更新"

limit_constraints: |
  1. 不修改 odoo/ 官方代码与原生 stock/account 模块
  2. workflow_engine.md V1.0 为开发冻结基线；状态机修改必须业务负责人 + 架构师双审批
  3. 事件驱动单向联动：下游禁止直接改写上游状态
  4. 状态是计算结果，Event 是唯一事实：状态变更必先写 Transport Event Ledger
  5. 异常字段化、不新增独立异常状态
  6. Scene 唯一业务语义入口；destination_type 下线后仅保留兼容计算
  7. 与 Sprint49 Rule Engine 集成：BLOCK 拦截、WARNING 记录
  8. 前端/API/Excel/自动建单共用同一套守卫与矩阵校验

risk_precheck: |
  - 存量状态值迁移（plan allocated→reserved、request validated 移除等）
  - destination_type 下线影响视图/校验/创建逻辑，需逐处清理
  - Transport Event Ledger 写入顺序与事务一致性
  - Sprint49 未完成前，Business Matrix Snapshot 生命周期钩子依赖其字段
