limit_constraints: |
  1. condition_expression 禁止 Python expression / SQL / eval / script——仅 catalog 语法。
  2. condition_expression field 必须来自 field catalog 白名单。
  3. Action 仅限 Exception Domain（CREATE_EXCEPTION/SET_PRIORITY/AUTO_CLOSE_EXCEPTION/CREATE_CASE）。
  4. Rule Execution 仅记录 MATCHED，execution_id 全局唯一保证幂等。
  5. CREATE_EXCEPTION 前检查同 source + type 的 active exception——防重复。
  6. 同一 code 同一时间仅允许一个 active version。
  7. Sprint37 Legacy Handler 保留 fallback（Sprint40 删除——Sprint39 观察期）。
  8. 本期不做 Dashboard/BI/AI/自动付款/OCR。
  9. Rule Cache Policy 一期简单实现（worker memory + manual refresh），二期优化。

