    - 禁止创建自动付款/自动记账逻辑
    - 禁止修改 Sprint36-A import 流程
    - 禁止修改 matching confidence 算法
    - 禁止修改 allocation 计算逻辑
    - 禁止修改已有 governance baseline（允许新增 versioned 策略资产）
    - 禁止修改 execution/scripts/ 下任何文件
    - 禁止修改 profiles/context_loader/intent 体系

risk_precheck: |
  1. source_reference.snapshot 避免存储过大 JSON——仅关键字段（amount/currency/reference/carrier）。
  2. AMOUNT_MISMATCH 检测复用现有金额比对逻辑，不重复造轮。
  3. sla_status compute field 避免频繁 re-compute——使用 depends on created_at + sla_deadline。
  4. exception_policy.yaml 与 sprint38 Rule Engine 的关系：37 固定策略 → 38 规则配置化。

goal: >
  建立 Settlement Exception Domain v1.0，
  让 Settlement Domain 从「可以运行」进入「可运营」。

  本期交付能力：

  1. Exception Detection — 系统自动检测（matching/billing/import handler）
  2. Auto Resolution — DUPLICATE_INVOICE 系统自动 closed（白名单）
  3. Case Routing — 人工类型 exception 自动关联 case
  4. SLA Governance — 策略资产化，compute sla_status
  5. Operational Evidence — source_reference.snapshot 证据链

  架构变化：

  ```
  Import → Billing → Matching → Allocation → Batch
              |          |            |          |
              v          v            v          v
            Exception_Detection_Engine（Handler Registry）
              |          |
              v          v
        Auto-Resolution  Manual → Case → Resolution
         (whitelist)
  ```

# ADR-037 关键决策：
#   1. Exception 是系统检测层，Case 是人工处理层，职责分离
#   2. source_reference 包含 snapshot JSON（运营证据链）
#   3. assigned 状态要求 assigned_to != null（invariant）
#   4. resolution_mode: manual(default) | auto，DUPLICATE_INVOICE 白名单
#   5. manual exception 在 assigned/processing/resolved 时要求 case_id 非空（new 时不要求）
#   6. sla_status 为 compute field，不 stored
#   7. Policy 资产化（sla_policy.yaml + exception_policy.yaml）
#   8. Exception Handler Registry 预留 Sprint38 Rule Engine 接管
#   9. Sprint38: Rule Engine  /  Sprint39: Dashboard / Analytics
