    - static_check
    - module_upgrade
    - data_migration
    - runtime_validate
    - business_review
  required_pass: all

deliverables:
  - 本契约文件（v1.3）
  - Request 页面 Create Carrier Inquiry / Create Customer Quote（transient wizard）
  - carrier inquiry 语义与状态机对齐
    （draft / sent / responded / selected / rejected / closed）
  - customer quote state 收敛 + communication_status + accepted_by / accepted_date
    + source_inquiry_id 强绑定
  - order 追溯字段回填（carrier_id / quote_id / inquiry_id）
  - 事件码 INQUIRY_SELECTED / QUOTE_CLOSED / ORDER_CREATED；
    INQUIRY_ACCEPTED deprecated；沟通事件审计保留
  - BUSINESS-DEBT-001 v2 / BUSINESS-DEBT-002 登记
  - 存量 inquiry / quote 状态迁移与 quote 元数据回填
  - manifest 版本升级
  - 模块升级验证记录

limit_constraints:
  - 不引入 Supplier Quote 模型，不新增采购侧报价中间层
  - 保留 ORM 模型名 transport.inquiry / transport.quote / transport.order；
    领域语义与 UI 对齐（Carrier Inquiry / Customer Quote / Supplier Order）；
    ORM 重命名登记为后续债务
  - 不改 Request / Order / Plan 状态机与 Event Ledger 结构
  - 事件码不删除；新增仅限 INQUIRY_SELECTED / QUOTE_CLOSED / ORDER_CREATED；
    INQUIRY_ACCEPTED 标记 deprecated
  - 允许新增 workflow metadata 字段
    （quote.communication_status / accepted_by / accepted_date；
    inquiry 成本/响应字段对齐），不扩展客户商务层
  - 不修改 matrix / vehicle_requirement / vehicle_allocation 快照结构
  - 冻结基线修改需 business_owner + architect 双审批
