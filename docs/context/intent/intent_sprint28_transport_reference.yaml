# ==============================================================
# 【Sprint28 意图契约】
# 功能：transport.reference 物流业务索引层
# 前置基线：Sprint27 承运商结算数据底座
# 基线版本：context_version: 1.0.42 -> 1.0.43
# ==============================================================

intent_id: INT-TMS-SPRINT28-001
intent_work_type: Development
intent_change_type: New Feature
title: 物流业务索引层 — transport.reference

target_scope: >
  基于《承运商结算需求说明书 V1.2》§6.1 P0 要求和架构评审结论，
  建设 transport.reference 物流业务索引层。
  定位为 IFFM/OMS/TLMS 三系统松耦合的业务引用索引，
  不做 Odoo Reference 核心关联，改用显式业务关联字段。
  同一个 ref_value（如 container_no）允许多条记录存在。
  不承载业务状态，仅作为索引层。

accept_criteria:
  # 模型
  - "tlmp.transport.reference 模型完整：ref_type/ref_value/reference_role + 业务关联字段"
  - "ref_type 枚举：pickup_code / container_no / tracking_no / cmr_no / bl_no / booking_no / po_no / delivery_no / shipment_no"
  - "reference_role 枚举：identifier（业务唯一识别）/ equipment（设备编号）/ document（文件编号）/ external（外部系统号码）"
  - "显式业务关联：res_model + res_id（Char+Integer 组合），支撑跨系统（IFFM/OMS/TLMS）通用关联"
  - "external_reference_model + external_reference_id 作为扩展字段（Char+Integer）"
  - "reference_policy: duplicate_allowed=true, 同一 ref_value 允许多条记录（container_no 等设备编号天然重复合法）"
  - "source_system 字段：Selection(iff/oms/tlms/external)，追踪引用来源系统"
  - "Odoo Reference 保留但仅作为弱关联：用于 UI 跨模型跳转，不作为业务逻辑主键"
  # 视图
  - "transport.reference 表单/列表/搜索视图（支持按 ref_type+ref_value+role 检索历史）"
  - "transport.order 提供 action_open_references 方法，打开对应 reference 列表"
  # 动作
  - "transport.order 创建时自动生成 shipment_no reference（ref_type=shipment_no, role=identifier, ref_value=order.name）"
  - "transport.order 表单支持 action_open_references 智能按钮跳转"
  - "支持手动创建/编辑/删除 reference 记录"
  # 验证
  - "reference 仅作为索引层，不承担业务状态"
  - "verify.py 8/8 PASS + odoo_check PASS"

source:
  type: customer_demand
  origin_team: 架构/成本域

asset_snapshot_profile: development
asset_snapshot_mode: human

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: affected_asset_only
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    - all_validation_pass
    - human_accept
    - risk_block

affected_assets:
  business:
    - transport_reference（新）
    - stock_rule（新增 reference 规则）
  architecture:
    - reference_views（新视图）
    - module_map（新增 transport.reference 模型）
    - dependency（新增引用索引域描述）

