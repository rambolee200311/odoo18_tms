validation_strategy:
  layers:
    - static_check
    - build_verify
    - auto_test
    - runtime_validate
    - business_review
  required_pass: all

deliverables:
  - "models/transport_reference.py（新增）"
  - "models/transport_order.py（增量：reference_ids + notebook page）"
  - "views/transport_reference_views.xml"
  - "views/transport_order_views.xml（增量可选：action_open_references 按钮）"
  - "security/ir.model.access.csv（新增权限，不含 base.group_user）"
  - "tests/test_transport_reference.py"
  - "docs/context/context_version.yaml（1.0.42 -> 1.0.43）"
  - "docs/context/architecture/module_map.md（更新）"
  - "docs/context/history/decision_note.md（新增 ADR-028）"

limit_constraints: |
  1. transport.reference 仅作为业务引用索引层，不承载业务状态逻辑。
  2. 同一 ref_value 允许多条记录（container_no 等设备编号跨运输合法）。
  3. Odoo Reference 保留但仅作为弱关联（弱关联展示和跨模型跳转，不作为业务唯一关系）。
     核心业务关联统一使用 res_model + res_id（Char+Integer 组合）。
     — 不使用 Odoo Reference 字段作为业务逻辑主键（性能+无FK风险）。
  4. billing.line 不集成 reference_id（通过 Sprint27 allocation 链路已覆盖）。
  5. source_system 字段必填，标识引用来源系统（iff/oms/tlms/external）。
  6. ref_type 保留 Selection（Sprint30 后迁移主数据档案）。
  6. base.group_user 无权读取 reference 数据（安全隔离）。

reference_policy:
  unique: false
  duplicate_allowed: true
  bind_model: "res_model + res_id (Char+Integer), 不绑定固定模型"
  reference_field: "保留 Odoo Reference, 仅用于弱关联 UI 跳转"

risk_precheck: |
  1. container_no 多条记录场景：不做唯一约束，纯索引查询。
  2. Odoo Reference 不作为核心字段：选型正确性已由架构评审确认。
  3. billing.line 不集成 reference_id：已有 Sprint27 allocation 链路。
  4. ref_type 主数据化：本次保留 Selection，Sprint30 后迁移。

# Goal
goal: >
  建设 transport.reference 物流业务索引层，
  为 IFFM/OMS/TLMS 三系统提供统一的跨系统索引关联能力。
  核心设计原则：
  - 同一 ref_value 允许多条记录（container_no 跨运输合法）
  - 按 reference_role 分层：identifier/equipment/document/external
  - 显式业务关联替代 Odoo Reference
  - 仅索引层，不承载业务状态

scope:
  allow:
    - "addons/wd_tlms/models/transport_reference.py"
    - "addons/wd_tlms/models/transport_order.py（增量）"
    - "addons/wd_tlms/models/__init__.py"
    - "addons/wd_tlms/views/transport_reference_views.xml"
    - "addons/wd_tlms/views/transport_order_views.xml（增量）"
    - "addons/wd_tlms/views/tlmp_menus.xml（增量：Documents 菜单）"
    - "addons/wd_tlms/security/ir.model.access.csv"
    - "addons/wd_tlms/__manifest__.py"
    - "addons/wd_tlms/tests/test_transport_reference.py"
    - "docs/context/context_version.yaml"
    - "docs/context/architecture/module_map.md"
    - "docs/context/history/decision_note.md"

  forbid:
    - 禁止使用 Odoo Reference 字段作为核心关联机制
    - 禁止创建 billing.line.reference_id 关联
    - 禁止对 ref_value 添加唯一约束
    - 禁止创建 match.rule 自动匹配引擎
    - 禁止创建 tlmp.reference.type 档案模型
    - 禁止修改 transport_event/exception/extra_charge 跟踪模型
    - 禁止修改 cmr/dgd/pod/shipment_label 文档模型
    - 禁止修改 pricing_rule/fee/rate_base 计算逻辑
    - 禁止修改 execution/scripts/ governance/ 下任何文件
    - 禁止修改 profiles/context_loader/intent 体系
    - 禁止上传/解析/OCR 功能
    - 禁止 carrier API 集成
    - 禁止 settlement batch/case 功能
    - 禁止跨系统主动数据同步
    - 禁止 base.group_user 可读权限

# 权限设计：
#   settlement_clerk: RWC (no unlink)
#   manager:          RWC
#   operator:         R
#   viewer:           R
#   financier:        R
#   base.group_user:  无权访问
#
# ADR-028 关键决策：
#   1. 不使用 Odoo Reference 作为核心关联（性能+FK风险）
#   2. 同一 ref_value 允许多条记录（container_no 跨运输合法）
#   3. reference_role 分层：identifier/equipment/document/external
#   4. ref_type 保留 Selection（Sprint30 后迁移主数据）
#   5. billing.line 不集成 reference_id（Sprint27 allocation 链路已覆盖）
#   6. container_no 当前仅检索索引，不上升 container.asset
#   7. source_system 必填，标识引用来源（iff/oms/tlms/external）
#   8. res_model + res_id 作为核心关联，不绑定固定 Many2one
#   9. Odoo Reference 仅弱关联，不用于业务逻辑
